# skill-blindspot map: technical and API documentation (maps/tech-docs.yaml)
#
# Rules for this map
#   - Every node must cite at least one source that really exists in the
#     "sources" list, with a locator copied from that source: a heading, an
#     object or criterion title, an O*NET task statement, an ESCO skill name,
#     or a short statement from the page. Where a source has many pages, the
#     locator starts with the page title, then the heading or statement.
#   - Nodes may be merged and reworded, but a node with no source must never
#     be added. Gaps that no source covers are listed below, not added as nodes.
#   - Sources are only cited for titles and short statements; no body text is
#     copied. Descriptions are the map's own words.
#
# Boundaries with other maps
#   - writing (non-fiction articles): this map is for documentation that helps
#     a reader install, use, integrate with or operate a product or an API
#     (reference pages, procedures, code samples, API descriptions). An essay,
#     blog post or news-style article about a technology uses "writing". Some
#     O*NET 27-3042.00 and ESCO technical communicator items are cited by both
#     maps; here they apply to a documentation set, not to an article.
#   - software (changing software): "software" asks whether a code change also
#     updates its docs (documentation.technical-docs, documentation.review-docs)
#     and owns versioning, breaking changes and changelogs (release.versioning,
#     release.breaking-changes, release.changelog) and accessibility of the
#     product UI (implementation.accessibility). This map covers making the
#     documentation itself. When a task is both a code change and its docs,
#     check it against both maps.
#
# Licence and attribution
#   O*NET: This product includes information from the O*NET 31.0 Database by
#   the U.S. Department of Labor, Employment and Training Administration
#   (USDOL/ETA). Used under the CC BY 4.0 license. O*NET(R) is a trademark of
#   USDOL/ETA. The task statements are regrouped here, so this map is an
#   adaptation and has not been endorsed by USDOL/ETA.
#   ESCO: This publication uses the ESCO classification of the European
#   Commission. ESCO skill names are regrouped here, so this map is an
#   adaptation of ESCO. https://esco.ec.europa.eu
#   Google developer documentation style guide and Microsoft Writing Style
#   Guide: CC BY 4.0. OpenAPI Specification: Apache 2.0. OpenAPI
#   documentation (learn.openapis.org): CC BY 4.0. GitLab documentation:
#   CC BY-SA 4.0; only headings are cited, and this map is shared under the
#   same terms for the parts derived from them. PEP 257: public domain.
#   Google AIP, GitHub Docs, Write the Docs, RFC 2606, WCAG 2.2, the Python
#   documentation and the rustdoc book: page, heading and criterion titles and
#   short statements only (see "sources").
#   Not used on purpose: Diataxis (licence not found, as in the software map);
#   per-category percentages from arXiv:2503.04761 (not verified one by one).
#
# Not yet covered (no source found or read, so no node)
#   - ISO/IEC/IEEE 26514 and 26515 (information for users, agile
#     documentation): paid standards; the ISO page could not be read.
#   - Keeping several published versions of the docs in step with product
#     releases: no source page read.
#   - Measuring whether docs work (analytics, task success): only the ESCO
#     skill name "track key performance indicators".
#   - Description formats other than OpenAPI (AsyncAPI, GraphQL schemas): not
#     read. Protocol buffer comments are covered only through Google AIP-192.
#   - Release notes: left to the software map (release.changelog).

map:
  id: tech-docs
  title: Technical and API documentation
  version: 0.1.0
  updated: '2026-11-19'
  scope: 'Planning, writing, reviewing, publishing and maintaining technical documentation and API documentation for a software product: reference pages, procedures, getting-started pages, code samples, machine-readable API descriptions and READMEs. Out of scope: general non-fiction articles (see the writing map), the code change itself and its release (see the software map), marketing copy, hardware manuals.'
