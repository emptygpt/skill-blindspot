groups:
- id: doc-planning
  title: Plan the documentation
  nodes:
  - id: doc-planning.readers
    title: Name the readers and what they need to do
    description: Decide who will read the docs (new user, integrator, operator) and which tasks they come to finish, before choosing what to write.
    keywords:
    - audience
    - user needs
    sources:
    - ref: ESCO
      locator: identify ICT user needs
    - ref: MSSTYLE
      locator: Content planning
  - id: doc-planning.subject
    title: Agree what the docs must cover
    description: Settle with the product owners which features, versions and platforms the docs cover and to what depth.
    sources:
    - ref: ONET
      locator: '27-3042.00 task: Confer with customer representatives, vendors, plant executives, or publisher to establish technical specifications and to determine subject material to be developed for publication.'
  - id: doc-planning.gather
    title: Learn the product from its builders and its specs
    description: Read the specs, designs and code, try the product, and ask the engineers, so the docs describe how it really behaves.
    sources:
    - ref: ONET
      locator: '27-3042.00 task: Study drawings, specifications, mockups, and product samples to integrate and delineate technology, operating procedure, and production sequence and detail.'
    - ref: ONET
      locator: '27-3042.00 task: Observe production, developmental, and experimental activities to determine operating procedure and detail.'
    - ref: ESCO
      locator: gather technical information
    - ref: ESCO
      locator: interpret technical texts
  - id: doc-planning.topic-types
    title: Choose a topic type for each topic
    description: Give each topic one type, such as concept, task, reference or troubleshooting, and keep the content of a topic to that type. A page may hold several topics.
    keywords:
    - information type
    - content type
    sources:
    - ref: GITLAB
      locator: Documentation topic types (CTRT)
    - ref: ESCO
      locator: documentation types
    - ref: ESCO
      locator: utilise content types
  - id: doc-planning.single-source
    title: Keep one source of truth
    description: Keep each fact in one place and link to it, instead of repeating it in several pages, wikis or descriptions that drift apart.
    sources:
    - ref: GITLAB
      locator: 'Documentation Style Guide: Documentation is the single source of truth (SSoT)'
    - ref: OAI
      locator: Keep a Single Source of Truth
  - id: doc-planning.docs-with-code
    title: Write the docs together with the feature
    description: Plan the docs as part of the feature and ship them with it, rather than as a later separate task.
    sources:
    - ref: GITLAB
      locator: 'Documentation Style Guide: Docs-first methodology'
    - ref: GITLAB
      locator: 'Workflows: Including documentation with code'
  - id: doc-planning.legal-safety
    title: Include required legal and safety information
    description: Find out which warnings, licences, data handling notes or regulatory statements the docs must carry, and where.
    sources:
    - ref: ESCO
      locator: develop documentation in accordance with legal requirements
    - ref: ESCO
      locator: develop ICT safety information
    - ref: ESCO
      locator: product usage risks analysis
  - id: doc-planning.project
    title: Plan the documentation work
    description: Set the deliverables, owners, review steps and dates for the documentation work.
    applies_when: the documentation is a project with several pages or contributors
    sources:
    - ref: ESCO
      locator: manage content development projects
    - ref: ESCO
      locator: content development processes
- id: page-structure
  title: Structure pages and navigation
  nodes:
  - id: page-structure.order
    title: Organise information in a predictable order
    description: Arrange pages and sections so that readers meet prerequisites first and can find the same kind of information in the same place.
    sources:
    - ref: ESCO
      locator: structure information
    - ref: ONET
      locator: '27-3042.00 task: Organize material and complete writing assignment according to set standards regarding order, clarity, conciseness, style, and terminology.'
  - id: page-structure.headings
    title: Write descriptive titles and headings
    description: Give each page and section a heading that says what it covers or what task it helps with, in a consistent style and hierarchy.
    sources:
    - ref: GSTYLE
      locator: Headings and titles
    - ref: MSSTYLE
      locator: Scannable content
    - ref: WCAG
      locator: Success Criterion 2.4.6 Headings and Labels
  - id: page-structure.procedures
    title: Write procedures as numbered steps
    description: Put sequences in numbered steps, one action per step, with conditions and the place of the action before the instruction and optional steps marked.
    keywords:
    - steps
    - instructions
    - how-to
    sources:
    - ref: GSTYLE
      locator: Procedures
    - ref: GSTYLE
      locator: 'Highlights: Use numbered lists for sequences.'
    - ref: GSTYLE
      locator: 'Highlights: Put conditions before instructions'
    - ref: MSSTYLE
      locator: Procedures and instructions
  - id: page-structure.step-results
    title: Say what each step achieves
    description: Where it helps, state the goal of a step or the result the reader should see, so they can tell that the step worked.
    sources:
    - ref: GSTYLE
      locator: 'Procedures: Steps with goals'
    - ref: GSTYLE
      locator: 'Procedures: Steps with results or justifications'
  - id: page-structure.links
    title: Link selectively with descriptive link text
    description: Link only to the most relevant pages, and make link text say where it goes; avoid "click here" and bare URLs.
    sources:
    - ref: GSTYLE
      locator: Cross-references and linking
    - ref: GSTYLE
      locator: 'Cross-references and linking: Write descriptive link text'
    - ref: WCAG
      locator: Success Criterion 2.4.4 Link Purpose (In Context)
  - id: page-structure.readme
    title: Give the project a README
    description: Put a README at the root that says what the project does, how to install and start using it, where to get help and how to contribute.
    applies_when: the documentation lives in a code repository
    sources:
    - ref: GHREADME
      locator: About READMEs
    - ref: WTD
      locator: How to start writing technical documentation
  - id: page-structure.repo-links
    title: Use relative links and image paths in repository docs
    description: Inside a repository, link between Markdown files and images with relative paths so links keep working on branches and forks.
    applies_when: the documentation lives in a code repository
    sources:
    - ref: GHREADME
      locator: Relative links and image paths in markdown files
  - id: page-structure.troubleshooting
    title: Cover errors and troubleshooting
    description: Document the errors a reader is likely to meet, what causes them and how to fix them.
    sources:
    - ref: GITLAB
      locator: Documentation topic types (CTRT)
    - ref: OAS
      locator: Responses Object
- id: writing-style
  title: Language and style
  nodes:
  - id: writing-style.guide
    title: Follow one style guide
    description: Pick a documentation style guide and apply it to the whole set, including word choice, capitalisation, numbers and formatting.
    sources:
    - ref: GSTYLE
      locator: Google developer documentation style guide
    - ref: MSSTYLE
      locator: Microsoft Writing Style Guide
    - ref: ONET
      locator: '27-3042.00 task: Organize material and complete writing assignment according to set standards regarding order, clarity, conciseness, style, and terminology.'
  - id: writing-style.voice
    title: Address the reader directly in active voice
    description: Write to the reader as "you", say who does each action, and use present tense.
    sources:
    - ref: GSTYLE
      locator: 'Highlights: Use second person'
    - ref: GSTYLE
      locator: 'Highlights: Use active voice'
  - id: writing-style.terminology
    title: Use technical terms consistently
    description: Use one term for one thing, define terms and abbreviations on first use, and match the names used in the product and the code.
    sources:
    - ref: ESCO
      locator: apply ICT terminology
    - ref: GSTYLE
      locator: 'Write for a global audience: Use consistent terminology'
    - ref: GSTYLE
      locator: 'Write for a global audience: Clarify abbreviations and pronouns'
  - id: writing-style.global
    title: Write for a global audience
    description: Use short sentences, plain words in their main sense and few idioms, so readers with other first languages and translation tools can follow.
    sources:
    - ref: GSTYLE
      locator: Write for a global audience
    - ref: MSSTYLE
      locator: Global communications
    - ref: GITLAB
      locator: 'Documentation Style Guide: Writing for localization'
  - id: writing-style.inclusive
    title: Write inclusive docs and examples
    description: Avoid gendered, ableist or loaded terms, write around non-inclusive terms in code, and vary names and places in examples.
    sources:
    - ref: GSTYLE
      locator: Write inclusive documentation
    - ref: GSTYLE
      locator: 'Write inclusive documentation: Write diverse and inclusive examples'
    - ref: MSSTYLE
      locator: Bias-free communication
  - id: writing-style.timeless
    title: Describe the product as it is now
    description: Avoid "new", "now", "soon" and promises about future releases, which go out of date and mislead readers.
    sources:
    - ref: GSTYLE
      locator: Timeless documentation
    - ref: GSTYLE
      locator: 'Highlights: Don''t pre-announce anything in documentation.'
    - ref: GITLAB
      locator: 'Documentation Style Guide: Promising features in future versions'
  - id: writing-style.code-font
    title: Put code and UI text in the right format
    description: Format code elements, commands and file names in code font and UI labels in bold, and use one treatment for each kind of item.
    sources:
    - ref: GSTYLE
      locator: Code in text
    - ref: GSTYLE
      locator: 'Highlights: Put code-related text in code font'
    - ref: GSTYLE
      locator: 'Highlights: Put UI elements in bold'
    - ref: MSSTYLE
      locator: Formatting developer text elements
  - id: writing-style.dates
    title: Write dates and numbers unambiguously
    description: Use date and number formats that cannot be misread by readers in other countries.
    sources:
    - ref: GSTYLE
      locator: 'Highlights: Use unambiguous date formatting'
    - ref: MSSTYLE
      locator: Numbers
- id: api-reference
  title: API reference
  nodes:
  - id: api-reference.reference-comments
    title: Document every public API element
    description: Give each public class, member and method a description in the reference, usually from comments in the source code.
    keywords:
    - doc comments
    - docstrings
    - Javadoc
    sources:
    - ref: GSTYLE
      locator: API reference code comments
    - ref: GSTYLE
      locator: 'API reference code comments: Documentation basics'
    - ref: MSSTYLE
      locator: 'Reference documentation: Elements of a reference article'
  - id: api-reference.method-details
    title: Describe parameters, return values and exceptions
    description: For each method, say what it does, what every parameter means and allows, what it returns and which errors it raises.
    sources:
    - ref: GSTYLE
      locator: 'API reference code comments: Parameters'
    - ref: GSTYLE
      locator: 'API reference code comments: Return values'
    - ref: GSTYLE
      locator: 'API reference code comments: Exceptions'
  - id: api-reference.docstrings
    title: Follow the language's comment conventions
    description: Write doc comments in the form the language and its tools expect, such as a one-line summary followed by details.
    sources:
    - ref: PEP257
      locator: One-line Docstrings
    - ref: PEP257
      locator: Multi-line Docstrings
    - ref: AIP
      locator: Documentation
  - id: api-reference.reference-titles
    title: Keep reference pages consistent
    description: Title reference pages with the element name and type, and use the same headings and order on every reference page.
    sources:
    - ref: MSSTYLE
      locator: 'Reference documentation: Article titles'
    - ref: MSSTYLE
      locator: 'Reference documentation: Consistency is essential in reference documentation.'
  - id: api-reference.generated-review
    title: Review generated reference text
    description: When the reference is generated from source comments, check that the comments are complete and remove internal or implementation details.
    sources:
    - ref: MSSTYLE
      locator: 'Reference documentation: If you automatically generate reference documentation and comments from the source code, review the quality and appropriateness of the comments.'
    - ref: AIP
      locator: Internal comments
  - id: api-reference.deprecations
    title: Mark deprecated elements and give the replacement
    description: Mark deprecated methods, fields and operations in the reference and the API description, and say what to use instead or why there is no replacement.
    sources:
    - ref: GSTYLE
      locator: 'API reference code comments: Deprecations'
    - ref: AIP
      locator: Deprecations
    - ref: OAS
      locator: Declares this operation to be deprecated
  - id: api-reference.cross-references
    title: Link API names to their reference pages
    description: Where docs mention a class, method or field, link to its reference entry so readers can check details.
    sources:
    - ref: AIP
      locator: Cross-references
    - ref: GSTYLE
      locator: 'Code in text: Linking API terms in Android'
  - id: api-reference.guides
    title: Pair the reference with task guides
    description: Next to the reference, give guides that show how to do common tasks with the API, since a reference alone does not show where to start.
    sources:
    - ref: WTD
      locator: How to write API documentation
    - ref: GITLAB
      locator: Documentation topic types (CTRT)
- id: api-description
  title: Machine-readable API descriptions
  nodes:
  - id: api-description.design-first
    title: Write the API description before the code
    description: Agree on the API description first and build from it, so the docs and the implementation start from the same contract.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAI
      locator: Use a Design-First Approach
  - id: api-description.source-control
    title: Keep the description in source control
    description: Store the API description with the code, review its changes, and generate docs and tests from it instead of writing it by hand twice.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAI
      locator: Add OpenAPI Descriptions to Source Control
    - ref: OAI
      locator: There is Seldom Need to Write OpenAPI Descriptions by Hand
  - id: api-description.publish
    title: Publish the description to users
    description: Make the description file itself available, not only the rendered pages, so users can load it into their tools.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAI
      locator: Make the OpenAPI Descriptions Available to the Users
  - id: api-description.info
    title: Fill in API metadata
    description: State the API title, the version of the description document, licence, contact and server addresses so readers know what they are calling and where.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAS
      locator: Info Object
    - ref: OAS
      locator: Server Object
    - ref: OAS
      locator: License Object
  - id: api-description.operations
    title: Describe each operation
    description: Give every operation a summary, a description and a unique operationId, and group operations with tags.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAS
      locator: Operation Object
    - ref: OAS
      locator: Unique string used to identify the operation
    - ref: OAS
      locator: Tag Object
  - id: api-description.inputs
    title: Describe parameters, request bodies and schemas
    description: Describe every parameter and request body with its type, whether it is required, its limits and its meaning, using schemas.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAS
      locator: Parameter Object
    - ref: OAS
      locator: Request Body Object
    - ref: OAS
      locator: Schema Object
  - id: api-description.responses
    title: Describe success and error responses
    description: List the responses each operation can return, including error status codes, their bodies and headers.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAS
      locator: Responses Object
    - ref: OAS
      locator: Response Object
    - ref: OAS
      locator: Header Object
  - id: api-description.examples
    title: Give request and response examples
    description: Add realistic example values for parameters, bodies and responses.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAS
      locator: Example Object
  - id: api-description.security
    title: Document authentication
    description: Describe how clients authenticate and which operations need which credentials or scopes.
    applies_when: the API is an HTTP API described with OpenAPI or a similar format
    sources:
    - ref: OAS
      locator: Security Scheme Object
    - ref: OAS
      locator: Security Requirement Object
  - id: api-description.large
    title: Split and reuse parts of a large description
    description: For large APIs, move shared schemas and parameters into reusable components and references, and split the description into files.
    applies_when: the API description is large
    sources:
    - ref: OAI
      locator: Describing Large APIs
    - ref: OAS
      locator: Components Object
    - ref: OAS
      locator: Reference Object
- id: code-samples
  title: Code samples
  nodes:
  - id: code-samples.scenarios
    title: Base samples on real tasks
    description: Write samples for tasks readers actually have, starting simple and covering commonly used or tricky elements first.
    sources:
    - ref: MSSTYLE
      locator: 'Code examples: Create concise examples that exemplify key development tasks.'
    - ref: MSSTYLE
      locator: 'Code examples: Prioritize frequently used elements and elements that may be difficult to understand or tricky to use.'
  - id: code-samples.intro
    title: Introduce each sample
    description: Before a sample, say what it does and list what is needed to run it.
    sources:
    - ref: GSTYLE
      locator: 'Code samples: Introductory statements'
    - ref: MSSTYLE
      locator: 'Code examples: List the requirements and dependencies for using or running the example.'
  - id: code-samples.copy-run
    title: Make samples easy to copy and run
    description: Let readers copy a sample in one action and run it without hidden setup; mark omitted code clearly.
    sources:
    - ref: MSSTYLE
      locator: 'Code examples: Provide an easy way for developers to copy and run the code.'
    - ref: GSTYLE
      locator: 'Code samples: Basic guidelines'
  - id: code-samples.output
    title: Show the expected output
    description: Show what the sample prints or returns, so readers can check their result.
    sources:
    - ref: MSSTYLE
      locator: 'Code examples: Show expected output'
  - id: code-samples.style
    title: Follow the language's code style
    description: Format sample code the way the language's usual style guide does, with comments only where they help.
    sources:
    - ref: GSTYLE
      locator: 'Code samples: Code style guides'
    - ref: MSSTYLE
      locator: 'Code examples: Design code for reuse.'
  - id: code-samples.placeholders
    title: Mark and explain placeholders
    description: Format values the reader must replace as placeholders and explain each one.
    sources:
    - ref: GSTYLE
      locator: Format placeholders
    - ref: GSTYLE
      locator: 'Format placeholders: Explain placeholders'
  - id: code-samples.example-values
    title: Use reserved example names and addresses
    description: Use reserved example domains, IP addresses, emails and fictitious names in samples, never real customers, real hosts or real credentials.
    sources:
    - ref: RFC2606
      locator: TLDs for Testing, & Documentation Examples
    - ref: GSTYLE
      locator: Example domains and names
  - id: code-samples.tested
    title: Test that samples still run
    description: Run documented examples automatically where the toolchain allows, so samples break the build instead of silently going out of date.
    applies_when: the language has a documentation test tool, such as Python or Rust
    sources:
    - ref: DOCTEST
      locator: doctest — Test interactive Python examples
    - ref: RUSTDOC
      locator: Documentation tests
- id: images-media
  title: Images and media
  nodes:
  - id: images-media.select
    title: Choose images that explain
    description: Add screenshots, diagrams or charts only where they explain something faster than text.
    sources:
    - ref: ONET
      locator: '27-3042.00 task: Select photographs, drawings, sketches, diagrams, and charts to illustrate material.'
    - ref: ESCO
      locator: visual presentation techniques
  - id: images-media.alt-text
    title: Give every image alt text
    description: Give each informative image a text alternative, and do not put essential information only inside the image.
    sources:
    - ref: GSTYLE
      locator: 'Diagrams, figures, and other images: Alt text'
    - ref: GSTYLE
      locator: 'Diagrams, figures, and other images: Text in figures'
    - ref: MSSTYLE
      locator: Accessibility guidelines and requirements
    - ref: WCAG
      locator: Success Criterion 1.1.1 Non-text Content
  - id: images-media.captions
    title: Caption and describe figures
    description: Give figures captions and, for complex diagrams, a description in the text.
    sources:
    - ref: GSTYLE
      locator: 'Diagrams, figures, and other images: Figure captions'
    - ref: GSTYLE
      locator: 'Diagrams, figures, and other images: Figure descriptions'
  - id: images-media.quality
    title: Use sharp images
    description: Use high-resolution or vector images so text in them stays readable.
    sources:
    - ref: GSTYLE
      locator: 'Diagrams, figures, and other images: High-resolution images'
  - id: images-media.video
    title: Make videos and GIFs accessible
    description: Caption videos and give a text version of what a recording or GIF shows.
    applies_when: the docs include video, recordings or animated images
    sources:
    - ref: GSTYLE
      locator: 'Write accessible documentation: Videos, recordings, and GIFs'
    - ref: WCAG
      locator: Success Criterion 1.2.2 Captions (Prerecorded)
- id: doc-accessibility
  title: Accessible pages
  nodes:
  - id: doc-accessibility.reading
    title: Keep pages easy to read
    description: Use short sentences and plain words and keep the reading level suited to the audience.
    sources:
    - ref: GSTYLE
      locator: 'Write accessible documentation: Ease of reading'
    - ref: WCAG
      locator: Success Criterion 3.1.5 Reading Level
  - id: doc-accessibility.structure
    title: Use real headings, lists and tables
    description: Mark up headings, lists and tables as such, not only by visual style, so assistive technology can navigate them.
    sources:
    - ref: GSTYLE
      locator: Write accessible documentation
    - ref: WCAG
      locator: Success Criterion 1.3.1 Info and Relationships
  - id: doc-accessibility.color
    title: Do not rely on colour alone
    description: Do not carry meaning by colour only, and keep enough contrast in text and images.
    sources:
    - ref: WCAG
      locator: Success Criterion 1.4.1 Use of Color
    - ref: WCAG
      locator: Success Criterion 1.4.3 Contrast (Minimum)
  - id: doc-accessibility.page
    title: Set page titles and language
    description: Give each published page a title and declare its language.
    applies_when: the docs are published as web pages
    sources:
    - ref: WCAG
      locator: Success Criterion 2.4.2 Page Titled
    - ref: WCAG
      locator: Success Criterion 3.1.1 Language of Page
- id: docs-build
  title: Docs as code and publishing
  nodes:
  - id: docs-build.docs-as-code
    title: Treat docs as code
    description: Keep docs in plain-text markup in version control, review them like code and build them with the same tools.
    sources:
    - ref: WTD
      locator: Docs as code
    - ref: ESCO
      locator: use markup languages
    - ref: ESCO
      locator: apply tools for content development
  - id: docs-build.lint
    title: Lint docs and check links in CI
    description: Run prose linters, Markdown linters and link checkers on every change, and let writers run them locally.
    sources:
    - ref: GITLAB
      locator: Documentation testing
    - ref: GITLAB
      locator: 'Documentation testing: Run Vale, markdownlint, or link checks locally'
  - id: docs-build.publish
    title: Publish to the right outputs
    description: Decide where the docs appear (site, in-product help, PDF, package page) and check the rendered result in each.
    sources:
    - ref: ESCO
      locator: integrate content into output media
    - ref: ESCO
      locator: publishing strategy
    - ref: ONET
      locator: '27-3042.00 task: Assist in laying out material for publication.'
  - id: docs-build.online-help
    title: Maintain in-product and online help
    description: Keep help pages and in-product help linked to the features they explain.
    applies_when: the product has online or in-product help
    sources:
    - ref: ONET
      locator: '27-3042.00 task: Develop or maintain online help documentation.'
    - ref: ESCO
      locator: provide online help
    - ref: ESCO
      locator: ICT help platforms
  - id: docs-build.findable
    title: Make docs findable
    description: Add metadata, page descriptions and the words readers search for, so search engines and site search find the right page.
    sources:
    - ref: ESCO
      locator: manage content metadata
    - ref: MSSTYLE
      locator: Search and writing
  - id: docs-build.cms
    title: Use the content management system correctly
    description: When docs live in a CMS or help platform, follow its structure, reuse and publishing workflow.
    applies_when: the docs are managed in a content management system
    sources:
    - ref: ESCO
      locator: use content management system software
- id: doc-review
  title: Review and quality
  nodes:
  - id: doc-review.edit
    title: Edit for standards and consistency
    description: Edit drafts, including other people's, against the style guide and the set's terminology.
    sources:
    - ref: ONET
      locator: '27-3042.00 task: Edit, standardize, or make changes to material prepared by other writers or establishment personnel.'
  - id: doc-review.technical
    title: Get a technical review
    description: Have the people who built the feature check that the docs are technically correct, and have a writer check clarity and style.
    sources:
    - ref: GITLAB
      locator: 'Workflows: Developer responsibilities'
    - ref: GITLAB
      locator: 'Workflows: Technical writer responsibilities'
  - id: doc-review.qa
    title: Check the docs before publishing
    description: Do a final pass for accuracy, completeness, broken links, formatting and whether the page meets its purpose.
    sources:
    - ref: ESCO
      locator: conduct content quality assurance
    - ref: MSSTYLE
      locator: Final publishing review
  - id: doc-review.ai-generated
    title: Check AI-generated documentation
    description: When docs are drafted with AI, have a person verify every statement, sample and link before it is published.
    sources:
    - ref: GITLAB
      locator: 'Documentation Style Guide: AI-generated content'
    - ref: GITLAB
      locator: 'Workflows: AI-generated documentation'
  - id: doc-review.plagiarism
    title: Do not copy others' text
    description: Write in your own words and do not paste text from other documentation without permission and attribution.
    sources:
    - ref: GITLAB
      locator: 'Documentation Style Guide: Plagiarism'
  - id: doc-review.records
    title: Keep records of revisions
    description: Keep the history of changes and the reasons for them, so reviewers and later writers can see what changed.
    sources:
    - ref: ONET
      locator: '27-3042.00 task: Maintain records and files of work and revisions.'
- id: doc-maintenance
  title: Maintain the docs
  nodes:
  - id: doc-maintenance.revise
    title: Revise docs when the product changes
    description: Watch product changes and published pages, and update or add docs where they no longer match.
    sources:
    - ref: ONET
      locator: '27-3042.00 task: Analyze developments in specific field to determine need for revisions in previously published materials and development of new material.'
    - ref: ONET
      locator: '27-3042.00 task: Review published materials and recommend revisions or changes in scope, format, content, and methods of reproduction and binding.'
  - id: doc-maintenance.feedback
    title: Act on reader feedback
    description: Collect feedback and issues about the docs and triage them regularly.
    sources:
    - ref: GITLAB
      locator: 'Workflows: Documentation feedback and improvements'
  - id: doc-maintenance.remove
    title: Remove outdated pages
    description: Delete or redirect pages for removed features instead of leaving them hidden or stale.
    sources:
    - ref: GITLAB
      locator: 'Workflows: Delete instead of hiding documentation'
    - ref: GITLAB
      locator: 'Workflows: Moving content'
  - id: doc-maintenance.localise
    title: Keep translations in step
    description: When docs are translated, plan the localisation workflow and check translated pages when the source changes.
    applies_when: the docs are translated
    sources:
    - ref: ESCO
      locator: manage localisation
    - ref: GITLAB
      locator: 'Documentation testing: Tests for translated documentation'
