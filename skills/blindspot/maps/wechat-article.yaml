- id: W3
  title: 微信公众平台文章原创保护指引
  publisher: 微信团队 / Tencent
  url: https://mp.weixin.qq.com/cgi-bin/announce?action=getannouncement&key=11565151480ZCKVy&version=1&lang=zh_CN&platform=2
  retrieved: '2026-11-16'
