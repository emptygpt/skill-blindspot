- id: W4
  title: 微信公众平台转载功能使用条款
  publisher: 微信团队 / Tencent
  url: https://mp.weixin.qq.com/cgi-bin/announce?action=getannouncement&key=11544165763bBflv&version=1&lang=zh_CN&platform=2
  retrieved: '2026-11-16'
  licence: not verified
- id: W5
  title: 微信公众号和服务号推荐运营规范
  publisher: 微信团队 / Tencent
  url: https://mp.weixin.qq.com/cgi-bin/announce?action=getannouncement&key=11697600328G0Tbo&version=1&lang=zh_CN&platform=2
  retrieved: '2026-11-16'
  licence: not verified
