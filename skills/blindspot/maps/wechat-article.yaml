  licence: not verified (page last edited 2026-03-10)
exclude: []
groups:
- id: wx-meta
  title: Title, cover and summary
  nodes:
  - id: wx.title-length
    title: Keep the title within 32 characters
    description: Check the title length against the platform limit before saving the draft.
    sources:
    - ref: W6
      locator: 标题，总长度不超过32个字。
  - id: wx.title-accurate
    title: Make the title accurate, complete and not alarmist
    description: The title must state what the article is about, give the key information and match the content.
    sources:
    - ref: W1
      locator: 4.11 煽动、夸大、误导类内容
    - ref: W1
      locator: 平台鼓励创作者提供准确、清晰、能体现文章内容主旨的标题，不允许通过标题噱头诱导用户点击或误导用户。
    - ref: W5
      locator: 5.3.3 误导类标题
    - ref: W5
      locator: 5.3.4 关键信息缺失、不完整的标题
    - ref: W2
      locator: 使用夸张标题，内容与标题严重不符的
  - id: wx.title-no-bait
    title: Keep the title free of bait and lurid hooks
    description: Do not use edge-of-rule wording, rare characters, sexual hooks or fake system notices in the title to get clicks.
    sources:
    - ref: W1
      locator: 违规擦边（如低俗擦边、标题党擦边）、使用了生僻字/绕过字体形式对抗等的标题
    - ref: W1
      locator: 文章标题刻意突出性相关内容、制造低俗噱头以吸引点击
    - ref: W1
      locator: 4.21 诱骗点击类内容
  - id: wx.cover-set-crop
    title: Set the cover image and its crops
    description: Choose a cover image stored as permanent material and set the 2.35:1 and 1:1 crops.
    sources:
    - ref: W6
      locator: 图文消息的封面图片素材id（必须是永久MediaID）
    - ref: W6
      locator: 图文消息（news）仅支持“2.35_1”“1_1”
  - id: wx.cover-quality
    title: Check the cover is clean and complete
    description: The cover must be sharp, show people completely, carry no obvious marks and not be lurid.
    sources:
    - ref: W5
      locator: 封面图人物不完整、存在明显标记，或者画质不清等
    - ref: W1
      locator: 擦边的封面
    - ref: W1
      locator: 以低俗的配图引诱用户阅读文章、关注微信公众号或服务号
  - id: wx.summary-author-fields
    title: Fill in summary and author within the limits
    description: Write the summary (up to 120 characters, single-article posts only) and the author field (up to 16 characters); if the summary is blank the first 54 characters of the body are used.
    sources:
    - ref: W6
      locator: 图文消息的摘要，总长度不超过120个字。
    - ref: W6
      locator: 如果本字段为没有填写，则默认抓取正文前54个字。
    - ref: W6
      locator: 作者，总长度不超过16个字。
  - id: wx.read-original-link
    title: Use the Read-original link and in-body links properly
    description: Set the Read-original address (up to 1 KB) only for a real source, and do not hide the answer behind it.
    sources:
    - ref: W6
      locator: 图文消息的原文地址，大小不可超过1 kb，即点击“阅读原文”后的URL
    - ref: W8
      locator: 图文消息支持正文中插入自己账号和其他公众号已群发文章链接的能力。
    - ref: W1
      locator: 点击阅读原文跳转第三方平台方可知晓答案
  - id: wx.topic-tags
    title: Add only relevant topic tags
    description: Tags on the article must relate to its content and must not mislead.
    sources:
    - ref: W1
      locator: 3.18 违规使用话题标签能力
    - ref: W1
      locator: 添加的标签与文章本身无任何关联，且标签内容会对用户产生煽动、误导等不良影响。
    - ref: W5
      locator: 添加无关标签以误导用户
- id: wx-body
  title: Body content and images
  nodes:
  - id: wx.body-limits
    title: Keep the body within size limits
    description: The body must be HTML under 20,000 characters and 1 MB; scripts are removed.
    sources:
    - ref: W6
      locator: 必须少于2万字符，小于1M，且此处会去除JS
  - id: wx.body-images
    title: Upload in-body images through the platform
    description: Images in the body must come from the platform's image upload (jpg or png, under 1 MB); external image URLs are filtered out.
    sources:
    - ref: W6
      locator: 外部图片url将被过滤。
    - ref: W8
      locator: 图片仅支持jpg/png格式，大小必须在1MB以下。
  - id: wx.layout-readability
    title: Typeset for a good reading experience
    description: Design and format the article so it reads well on the platform.
    sources:
    - ref: W5
      locator: 提供给用户好的阅读体验、精美的设计和排版的内容。
  - id: wx.no-hidden-or-stuffed-text
    title: Keep out hidden text and keyword stuffing
    description: Do not repeat keywords, hide text from readers, or use tiny or white text.
    sources:
    - ref: W1
      locator: 关键词堆砌
    - ref: W1
      locator: 隐藏文字
    - ref: W1
      locator: 恶意隐藏文字的内容
    - ref: W1
      locator: 4.17 恶意编辑
  - id: wx.sensitive-images
    title: Blur sensitive body images
    description: Medical, injury or child images need covering, blurring or cropping before publishing.
    applies_when: the article shows medical images, injuries or children
    sources:
    - ref: W1
      locator: 4.26 不适宜直接展示内容
    - ref: W1
      locator: 发布前应作遮挡、模糊或裁切等必要处理
- id: wx-original
  title: Original declaration and reprints
  nodes:
  - id: wx.original-eligibility
    title: Check the article qualifies before declaring it original
    description: Do not declare original for compiled, quoted, public, marketing or non-exclusive content.
    applies_when: the author wants to use the original declaration
    sources:
    - ref: W1
      locator: 3.6.1 文章滥用原创声明
    - ref: W3
      locator: 一、文章原创的概念
    - ref: W3
      locator: 5.2.3 文章由自己整理并且重新排版，且网上找不到类似文章，为何被判定为滥用原创
  - id: wx.original-precheck
    title: Expect the send-time originality check
    description: The platform compares the text at send time; handle a block by appeal and do not edit after appealing.
    sources:
    - ref: W3
      locator: （事前）群发撞库流程
    - ref: W3
      locator: 5.1.1 群发时被拦截了，无法群发该怎么办
    - ref: W3
      locator: 5.1.3 为什么我群发撞库被拦截后申诉成功了，还是发不出去
  - id: wx.reprint-official-path
    title: Reprint only through the official reprint path
    description: Reprint with authorisation and through the reprint entry, not by pasting; check the original owner may license it.
    applies_when: reprinting another account's article
    sources:
    - ref: W3
      locator: 5.4.3 如何正确转载他人的原创文章
    - ref: W4
      locator: 须自行核查就所转载之作品
    - ref: W1
      locator: 4.14 转载内容
  - id: wx.reprint-whitelist
    title: Set reprint permissions for your own articles
    description: Add accounts to the reprint list and choose whether they may edit or hide the source.
    applies_when: allowing others to reprint an original article
    sources:
    - ref: W3
      locator: 5.4.1 别的帐号想要转载我的文章，让我给开白，我要怎么操作呢？
    - ref: W4
      locator: 长期转载功能
    - ref: W4
      locator: 单篇转载功能
    - ref: W4
      locator: 是否授予转载公众号/服务号不显示转载作品之来源的权限
  - id: wx.no-washing
    title: Do not paraphrase other people's articles
    description: Avoid rewriting another article by swapping synonyms or moving paragraphs; keep the argument and structure your own.
    sources:
    - ref: W1
      locator: 4.1.3原创性存在争议
    - ref: W5
      locator: 7.2 疑似搬运、抄袭等原创度较低的内容
    - ref: W5
      locator: 通过洗稿重组，保留他人原文核心逻辑/数据，仅重组语序/段落、替换近义词或增减无效信息
  - id: wx.complaint-response
    title: Answer a copying complaint within 24 hours
    description: Check the complaint notice and respond with evidence within the time limit, or it goes to panel review.
    applies_when: a copying complaint notice is received
    sources:
    - ref: W3
      locator: 5.3.10 收到了一条洗稿投诉，该怎么办，洗稿会怎么处理
    - ref: W3
      locator: 需在24小时内承认或回应
- id: wx-compliance
  title: Content rules for official-account articles
  nodes:
  - id: wx.ad-label
    title: Mark ads as advertisements
    description: Content that is an advertisement must carry the word for advertisement and follow advertising law.
    applies_when: the article carries paid or third-party marketing
    sources:
    - ref: W1
      locator: 4.20 第三方商业营销内容违规
    - ref: W1
      locator: 内容构成广告但未依法标明“广告”字样的
    - ref: W1
      locator: 4.15 违反市场监管法律法规或规范性文件的内容
  - id: wx.overmarketing
    title: Avoid over-marketing and health claims
    description: Do not exaggerate products, claim medical effects for ordinary goods, or spread false health information.
    applies_when: the article recommends products, services or health practices
    sources:
    - ref: W1
      locator: 4.8 过度营销类内容
    - ref: W1
      locator: 非医疗用品不得明示或暗示产品具备医疗功效或声称具有保健作用
    - ref: W1
      locator: 涉及食品安全、健康养生等日常生活、科学知识方面的不实消息
    - ref: W5
      locator: 5.1 不规范医疗科普和行为
    - ref: W5
      locator: 6、 营销推广
  - id: wx.finance-claims
    title: Do not promise investment returns
    description: Do not sell investment courses or tips with certain returns, or recommend stocks, without the licence.
    applies_when: the article is about investing or finance
    sources:
    - ref: W1
      locator: 3.29.4 财经利诱类
    - ref: W1
      locator: 4.8.3文章主要是推广股票的投资方法/课程或直接推荐股票
    - ref: W1
      locator: 3.8.1 从事需要特许资质的金融类相关业务
  - id: wx.source-labelling
    title: Label the source for current-affairs information
    description: State the source account on its own line at the start or end of the text.
    applies_when: the article reports domestic current events, policy or social events
    sources:
    - ref: W1
      locator: 4.24 信息资讯未标注信息来源
    - ref: W1
      locator: 在正文开头或结尾单独一行标注“来源：官方账号全称”
  - id: wx.ai-label
    title: Label AI-generated content
    description: Mark AI-generated or synthesised content prominently, and do not let AI produce the main body without saying so.
    applies_when: AI tools help produce text or images
    sources:
    - ref: W1
      locator: 发布生成式人工智能生成合成内容时，必须依据法律法规进行显著标识
    - ref: W5
      locator: 7.4 低价值AIGC内容
    - ref: W5
      locator: 通过AIGC等技术生成文章主体内容，占比显著高于人工创作部分，且并不声明AI辅助创作
  - id: wx.no-templated-or-automated
    title: Avoid templated and fully automated writing
    description: Do not replace the human author with AI or scripts, or post highly similar template articles at high frequency.
    sources:
    - ref: W1
      locator: 3.27 非真人自动化创作行为
    - ref: W1
      locator: 3.28 套路化模板写作行为
    - ref: W5
      locator: 7.1 同质化内容，频繁发布高度相似内容，缺乏信息增量
  - id: wx.no-induced-share-follow
    title: Do not force or reward sharing and following
    description: Do not require or reward sharing, following or subscribing to read on.
    sources:
    - ref: W1
      locator: 3.3.1 诱导分享
    - ref: W1
      locator: 3.3.2 诱导关注
    - ref: W1
      locator: 3.22 强制关注行为
    - ref: W2
      locator: 强制、诱导其他用户关注账号、点击链接页面或分享信息的
  - id: wx.no-external-diversion
    title: Do not use half-articles to divert readers
    description: Give the full information in the article; do not push readers to QR codes, links or private accounts to get it.
    sources:
    - ref: W1
      locator: 发表不完整内容，并通过二维码、文字、链接、图标等形式，引导用户跳转至其他内容
    - ref: W5
      locator: 5.4 导流内容
    - ref: W5
      locator: 互动导流
  - id: wx.false-info
    title: Avoid false, unverifiable or outdated claims
    description: Do not invent facts, cite data that cannot be verified, or re-spread outdated information.
    sources:
    - ref: W1
      locator: 4.9 不实信息类内容
    - ref: W5
      locator: 3、 不实信息
    - ref: W5
      locator: 引用疑似不存在的数据、案例、言论作为依据，且未提供可验证来源
    - ref: W5
      locator: 8、 过时信息
  - id: wx.personal-data
    title: Do not publish or collect personal data without consent
    description: Do not publish others' ID numbers, phones or photos, and do not collect reader data without clear consent.
    sources:
    - ref: W1
      locator: 未经授权发送他人身份证号码、照片等个人隐私资料
    - ref: W1
      locator: 4.16 收集用户隐私
    - ref: W1
      locator: 未经用户明确同意
  - id: wx.legal-red-lines
    title: Check against the prohibited-content lists
    description: Check the text and images against the legal prohibited-content list, including map rules.
    sources:
    - ref: W1
      locator: 4.12 违反国家法律法规禁止的内容
    - ref: W2
      locator: 发布、传送、传播、储存违反一切适用法律法规禁止的内容
    - ref: W1
      locator: 4.19 公开地图使用不规范
- id: wx-send
  title: Sending and platform features
  nodes:
  - id: wx.draft-first
    title: Save as a draft before publishing
    description: Put the article into the draft box first; a draft leaves the box once it is sent or published.
    sources:
    - ref: W7
      locator: 开发者需要先将图文素材以草稿的形式保存，选择要发布的草稿 media_id 进行发布。
    - ref: W6
      locator: 上传到草稿箱中的素材被群发或发布后，该素材将从草稿箱中移除。
  - id: wx.publish-status
    title: Confirm the publish result after submitting
    description: A successful submit only means the task was accepted; check for failure statuses such as originality or platform review.
    applies_when: publishing through the API
    sources:
    - ref: W7
      locator: 此时只意味着发布任务提交成功，并不意味着此时发布已经完成
    - ref: W7
      locator: '2:原创失败, 3: 常规失败, 4:平台审核不通过'
    - ref: W7
      locator: 53503 该草稿未通过发布检查
  - id: wx.api-eligibility
    title: Check the account may publish through the API
    description: Publishing a draft by API is limited to verified accounts.
    applies_when: publishing through the API
    sources:
    - ref: W7
      locator: 仅认证
    - ref: W7
      locator: 2025年7月起，个人主体账号、企业主体未认证账号及不支持认证的账号将被回收调用权限
  - id: wx.mass-send-limit
    title: Respect the mass-send limit
    description: Check that sends remain for the day and do not bypass the limit with single sends.
    sources:
    - ref: W3
      locator: 当天群发次数已经用完了，请第二天再群发
    - ref: W1
      locator: 利用任何第三方工具或其他方式规避群发限制策略，包括但不限于用公众平台的单发功能来实现群发功能
  - id: wx.recommendation-setting
    title: Decide on recommendation
    description: Choose whether the platform may recommend the article; it cannot be switched back on later.
    sources:
    - ref: W5
      locator: 创作者可选择是否允许内容被推荐
    - ref: W5
      locator: 一旦创作者选择不允许平台推荐，将无法针对该篇内容重新选择允许平台推荐
    - ref: W5
      locator: 转载和分组发表的内容将不会被推荐
  - id: wx.comments-setting
    title: Decide on comments
    description: Choose whether comments are open and whether only followers may comment.
    sources:
    - ref: W6
      locator: 是否打开评论，0不打开(默认)，1打开
    - ref: W6
