# skill-blindspot map: WeChat official account article (maps/wechat-article.yaml)
#
# Rules for this map
#   - This map extends "writing". It lists only what is specific to articles
#     published on a WeChat official account (subscription or service account).
#     Generic steps (research, fact-checking, editing and so on) stay in the
#     base map.
#   - Every node must cite at least one source that really exists in the
#     "sources" list of this map, with a locator copied from that source: a
#     clause number or title, or a short statement, in the original Chinese.
#   - Nodes may be merged and reworded, but a node with no source must never
#     be added. Gaps that no source covers are listed below, not added as nodes.
#   - Only titles, clause numbers and short statements are cited; no body text
#     is copied. The pages are Tencent publications; their licences are not
#     verified.
#   - The platform rules change. Check the "retrieved" date before relying on
#     a node.
#
# Licence and attribution
#   All sources in this map are Tencent pages (platform rules, agreements and
#   developer documentation). Only titles, clause numbers and short
#   statements are cited; their licence is not verified.
#
# Not yet covered (no source found or read, so no node)
#   - Official comment (message) management API page: the page tried returned
#     "page not found", so comment handling is covered only by the draft
#     parameters and operating-rule clauses above.
#   - Terms of the reward (appreciation) function and of the paid function:
#     linked from the service agreement but not opened.
#   - The "washing" complaint panel rules, and the video and comic originality
#     guidelines: linked but not opened.
#   - Exact mass-send quotas per account type, and scheduled sending: only a
#     mention that a daily limit exists was read.
#   - Official size and pixel specification of the cover and of in-body images
#     beyond the API limits cited above.
#   - Official typesetting rules (fonts, sizes, colours), collections and
#     original-declaration setup steps in the editor.
#   - Account registration, certification and naming rules: read in the
#     operating rules but out of scope for an article map.
#   - Statistics and reading-data pages of the platform.
#   - Rules for audio and video inserted in an article, and for image-message
#     (picture-post) format.

map:
  id: wechat-article
  extends: writing
  title: WeChat official account article
  version: 0.1.0
  updated: '2026-11-16'
  scope: 'Text-and-image articles sent from a WeChat official account (subscription or service account) on mainland China''s platform, from saving the draft to sending, and the platform''s rules that apply to them. Out of scope: account registration and certification, template and customer-service messages, mini programs, Channels video, and articles for other Chinese platforms.'
sources:
