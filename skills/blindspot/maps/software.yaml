# skill-blindspot map: changing software with an AI coding agent (maps/software.yaml)
#
# Rules for this map
#   - Every node must cite at least one source that really exists in the
#     "sources" list, with a locator copied from that source: a practice id and
#     title, a requirement or chapter title, an O*NET task statement with its
#     Task ID (may be shortened), a heading, or an ESCO skill name.
#   - Nodes may be merged and reworded, but a node with no source must never
#     be added. Gaps that no source covers are listed below, not added as nodes.
#   - Sources are only cited for titles and short statements; no body text is
#     copied.
#   - Group "agent" names risks that its sources describe. The sources name the
#     risks; they do not prescribe the practice written in the node description.
#
# Licence and attribution
#   O*NET: This product includes information from the O*NET 31.0 Database by
#   the U.S. Department of Labor, Employment and Training Administration
#   (USDOL/ETA). Used under the CC BY 4.0 license. O*NET(R) is a trademark of
#   USDOL/ETA. The task statements are shortened and regrouped here, so this
#   map is an adaptation and has not been endorsed by USDOL/ETA.
#   ESCO: This publication uses the ESCO classification of the European
#   Commission. ESCO skill names are regrouped here, so this map is an
#   adaptation of ESCO. https://esco.ec.europa.eu
#   OWASP: ASVS 5.0.0, the OWASP Top 10 for LLM Applications 2025 and the OWASP
#   Top 10 for Agentic Applications 2026 are CC BY-SA 4.0; OWASP Top 10:2025 is
#   CC BY 3.0 as stated on its page. Only chapter, section and risk titles and
#   a few short phrases are cited. Descriptions here are the map's own words;
#   this map is shared under the same terms for the parts derived from them.
#   SWEBOK Guide v4.0 (IEEE Computer Society): knowledge area titles only, as a
#   citation under the terms that allow quoting reasonable passages.
#   NIST SSDF (SP 800-218) and NIST AI 600-1: titles and short task statements.
#   Google engineering practices, Semantic Versioning, Conventional Commits:
#   CC BY 3.0. Keep a Changelog: MIT. DORA: CC BY 4.0. OpenChain: CC BY 4.0.
#   GitHub Docs, WCAG 2.2 and The Twelve-Factor App: page and criterion titles
#   only; their licences are not fully verified (see "sources").
#   Not used on purpose: the Google SRE book (CC BY-NC-ND 4.0, no adaptation),
#   SPDX and Diataxis (licence not found).
#
# Not yet covered (no source found or read, so no node)
#   - Requirement acceptance criteria and scope changes: only the SWEBOK
#     chapter title, one O*NET task and ESCO skill names exist; no step-level
#     source read (ISO/IEC/IEEE 29148 is a paid standard).
#   - Refactoring and technical debt: only the DORA "Code maintainability"
#     capability title and a Google review heading; no practice source.
#   - Debugging method: only ESCO "debug software" and one O*NET task;
#     no step-based source.
#   - Rules for an agent changing code (read the code first, keep to the task,
#     do not touch unrelated files, do not fake test results): no authoritative
#     source found. Group "agent" holds only named risks.
#   - Database migration and rollback practice beyond the DORA capability
#     title; performance tuning method.
#   - Release checklists, rollback plans, launch coordination, incident
#     management and post-mortems: the only found source is the SRE book
#     (licence blocks adaptation), so there is no node for them.
#   - Documentation types and style (tutorial, how-to, reference): Diataxis
#     licence not verified. API documentation and code comments style.
#   - Privacy law, licence choice for your own code, and export rules.
#   - Mobile, embedded and data/ML specifics; infrastructure as code.
#   - Estimating effort and project scheduling (SWEBOK management chapters were
#     not read below the chapter title).

map:
  id: software
  title: Changing software with an AI coding agent
  version: 0.1.0
  updated: '2026-11-17'
  scope: 'Making a change to software with the help of an AI coding agent, from understanding the request through design, implementation, testing, review, release, operation and maintenance. Out of scope: hiring and managing a team, project budgeting, hardware design.'
