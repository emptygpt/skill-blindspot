groups:
- id: requirements
  title: Understanding the request and its requirements
  nodes:
  - id: requirements.understand-request
    title: Understand what is being asked
    description: Restate the request in your own words, find the user need behind it, and check it is feasible within the time and cost available.
    sources:
    - ref: ONET
      locator: '15-1252.00 task 21662: Analyze user needs and software requirements to determine feasibility of design within time and cost constraints.'
    - ref: ESCO
      locator: identify customer requirements
    - ref: S1
      locator: 'Chapter 1: Software Requirements'
  - id: requirements.technical-spec
    title: Turn the request into technical requirements
    description: Interpret and define the technical requirements and performance standards the change must meet, and analyse the existing specification for conflicts.
    sources:
    - ref: ESCO
      locator: interpret technical requirements
    - ref: ESCO
      locator: define technical requirements
    - ref: ESCO
      locator: analyse software specifications
    - ref: ONET
      locator: '15-1252.00 task 21668: Determine system performance standards.'
    - ref: ONET
      locator: '15-1252.00 detailed work activity: Analyze project data to determine specifications or requirements.'
  - id: requirements.consult-and-report
    title: Consult the people affected and report status
    description: Confirm limits, interfaces and open questions with the people who know them, and keep requesters informed about status and technical issues.
    sources:
    - ref: ONET
      locator: '15-1252.00 task 21664: Confer with systems analysts, engineers, programmers and others to design systems and to obtain information on project limitations and capabilities, performance requirements and interfaces.'
    - ref: ONET
      locator: '15-1252.00 task 21665: Consult with customers or other departments on project status, proposals, or technical issues, such as software system design or maintenance.'
    - ref: ONET
      locator: '15-1252.00 task 21673: Prepare reports or correspondence concerning project specifications, activities, or status.'
    - ref: ONET
      locator: '15-1252.00 detailed work activity: Collaborate with others to determine design specifications or details.'
  - id: requirements.security-requirements
    title: Write down the security requirements
    description: Identify and document the security requirements the change must meet, and keep them current as the software changes.
    sources:
    - ref: S2
      locator: PO.1 Define Security Requirements for Software Development
    - ref: S2
      locator: 'PO.1.2: Identify and document all security requirements for organization-developed software to meet, and maintain the requirements over time.'
- id: design
  title: Architecture and design
  nodes:
  - id: design.plan-change
    title: Plan the change before making it
    description: Work out how a new system or a modification to an existing one will fit in, and decide the approach before writing code.
    sources:
    - ref: ONET
      locator: '15-1252.00 task 21661: Analyze information to determine, recommend, and plan installation of a new system or modification of an existing system.'
    - ref: ONET
      locator: '15-1252.00 task 21667: Design, develop and modify software systems, using scientific analysis and mathematical models to predict and measure outcomes and consequences of design.'
    - ref: ONET
      locator: '15-1252.00 detailed work activity: Design software applications.'
  - id: design.architecture-and-patterns
    title: Fit the change into the architecture and use known design patterns
    description: Check that the change respects the existing architecture and reach for established design patterns rather than inventing structure.
    sources:
    - ref: S1
      locator: 'Chapter 2: Software Architecture'
    - ref: S1
      locator: 'Chapter 3: Software Design'
    - ref: ESCO
      locator: use software design patterns
    - ref: S5
      locator: 'What to look for in a code review: Design'
  - id: design.prototype
    title: Build a prototype to test an idea
    description: Make a small throwaway version to learn whether an approach works before committing to it.
    sources:
    - ref: ESCO
      locator: develop software prototype
  - id: design.risk-modeling
    title: Model risks and threats
    description: Use threat modeling, attack modeling or attack-surface mapping to assess the security risk of the change, and avoid insecure design.
    keywords:
    - threat model
    sources:
    - ref: S2
      locator: 'PW.1.1: Use forms of risk modeling - such as threat modeling, attack modeling, or attack surface mapping - to help assess the security risk for the software.'
    - ref: S2
      locator: PW.1 Design Software to Meet Security Requirements and Mitigate Security Risks
    - ref: S4
      locator: A06:2025 - Insecure Design
  - id: design.decision-log
    title: Record design decisions
    description: Track the requirements, risks and design decisions behind the change so they can be found later, and reuse standard security features instead of home-made ones.
    keywords:
    - ADR
    - architecture decision record
    sources:
    - ref: S2
      locator: 'PW.1.2: Track and maintain the software''s security requirements, risks, and design decisions.'
    - ref: S2
      locator: 'PW.1.3: Where appropriate, build in support for using standardized security features and services'
    - ref: S3
      locator: V15.1 Secure Coding and Architecture Documentation
  - id: design.design-review
    title: Review the design before building
    description: Have someone who was not involved in the design, or an automated check, confirm it meets the requirements and addresses the known risks.
    sources:
    - ref: S2
      locator: PW.2 Review the Software Design to Verify Compliance with Security Requirements and Risk Information
    - ref: ONET
      locator: '15-1253.00 task 14646: Participate in product design reviews to provide input on functional requirements, product designs, schedules, or potential problems.'
    - ref: S5
      locator: 'What to look for in a code review: Design'
  - id: design.user-interface
    title: Design the user interface
    description: Design what the user sees and does for the change, where it has a visible interface.
    applies_when: the change touches a user interface
    sources:
    - ref: ESCO
      locator: design user interface
  - id: design.service-runtime-model
    title: Design a service to run as stateless processes with attached backing services
    description: For a service application, treat databases and queues as attached resources, keep processes stateless and scale by running more processes.
    applies_when: the software runs as a network service (not a library, CLI or mobile app)
    sources:
    - ref: S10
      locator: 'IV. Backing services: Treat backing services as attached resources'
    - ref: S10
      locator: VI. Processes
    - ref: S10
      locator: VII. Port binding
    - ref: S10
      locator: VIII. Concurrency
- id: implementation
  title: Implementation
  nodes:
  - id: implementation.modify-existing
    title: Modify existing code to correct, adapt or improve it
    description: Change existing software to fix errors, adapt it to a new environment or interface, or improve performance, while keeping the rest working.
    sources:
    - ref: ONET
      locator: '15-1252.00 task 21670: Modify existing software to correct errors, adapt it to new hardware, or upgrade interfaces and improve performance.'
    - ref: ONET
      locator: '15-1252.00 detailed work activity: Modify software programs to improve performance.'
    - ref: ESCO
      locator: computer programming
    - ref: S1
      locator: 'Chapter 4: Software Construction'
  - id: implementation.toolchain-and-build
    title: Use the agreed toolchain and secure build settings
    description: Use the project's tools, editors and build settings, and the compiler or build options that improve executable security.
    sources:
    - ref: S2
      locator: PO.3 Implement Supporting Toolchains
    - ref: S2
      locator: 'PW.6.1: Use compiler, interpreter, and build tools that offer features to improve executable security.'
    - ref: ESCO
      locator: utilise computer-aided software engineering tools
    - ref: ESCO
      locator: integrated development environment software
  - id: implementation.secure-coding
    title: Follow secure and defensive coding practices
    description: Apply the secure coding practices for the language in use and write defensively against bad inputs and states.
    sources:
    - ref: S2
      locator: PW.5 Create Source Code by Adhering to Secure Coding Practices
    - ref: S3
      locator: V15.3 Defensive Coding
    - ref: S3
      locator: V15.4 Safe Concurrency
  - id: implementation.input-and-output-handling
    title: Validate input and encode output
    description: Validate all input and business rules, use parameterised queries and encode output for its context to prevent injection.
    keywords:
    - sql injection
    - sanitize
    - escape
    sources:
    - ref: S3
      locator: V1 Encoding and Sanitization
    - ref: S3
      locator: V2 Validation and Business Logic
    - ref: S3
      locator: '1.2.4: parameterized queries'
    - ref: S4
      locator: A05:2025 - Injection
  - id: implementation.error-handling
    title: Handle errors without leaking internals
    description: Handle unexpected and exceptional conditions and return generic messages that do not expose stack traces or secrets.
    keywords:
    - exception
    - stack trace
    sources:
    - ref: S3
      locator: V16.5 Error Handling
    - ref: S3
      locator: '16.5.1: generic message'
    - ref: S4
      locator: A10:2025 - Mishandling of Exceptional Conditions
  - id: implementation.secrets
    title: Keep secrets out of code
    description: Store keys, tokens and passwords in a secrets manager or the environment, never in source, and block pushes that contain them.
    keywords:
    - api key
    - token
    - credential
    - .env
    sources:
    - ref: S3
      locator: V13.3 Secret Management
    - ref: S3
      locator: '13.3.1: A secrets management solution, such as a key vault, is used'
    - ref: S9
      locator: 'Secret scanning: Push protection'
    - ref: S9
      locator: 'Secret scanning: Secret leakage risks'
  - id: implementation.configuration
    title: Separate configuration from code and set secure defaults
    description: Keep deploy-specific settings outside the code, define a secure baseline, and make sure production carries no test code or sample snippets.
    sources:
    - ref: S10
      locator: 'III. Config: Store config in the environment'
    - ref: S2
      locator: PW.9 Configure Software to Have Secure Settings by Default
    - ref: S3
      locator: V13 Configuration
    - ref: S3
      locator: '15.2.3: production environment only includes functionality that is required'
    - ref: S4
      locator: A02:2025 - Security Misconfiguration
  - id: implementation.maintainable-code
    title: Keep the code simple, readable and maintainable
    description: 'Write code that other people can read and change: avoid needless complexity, use clear names and comments.'
    sources:
    - ref: S11
      locator: Code maintainability
    - ref: S5
      locator: 'What to look for in a code review: Complexity'
    - ref: S5
      locator: 'What to look for in a code review: Naming'
    - ref: S5
      locator: 'What to look for in a code review: Comments'
  - id: implementation.data-migration
    title: Migrate data and schema safely
    description: Plan and script data migrations and database schema changes so they can be repeated and checked.
    applies_when: the change alters stored data or a schema
    keywords:
    - migration
    - schema change
    sources:
    - ref: ESCO
      locator: develop automated migration methods
    - ref: ESCO
      locator: migrate existing data
    - ref: S11
      locator: Database change management
  - id: implementation.accessibility
    title: Keep the interface accessible
    description: Check text alternatives, keyboard use, contrast and input help so that people with disabilities can use the changed interface.
    applies_when: the change touches a user interface
    keywords:
    - a11y
    - WCAG
    - aria
    sources:
    - ref: S12
      locator: 1.1 Text Alternatives
    - ref: S12
      locator: 2.1 Keyboard Accessible
    - ref: S12
      locator: 1.4.3 Contrast (Minimum)
    - ref: S12
      locator: 3.3 Input Assistance
- id: testing
  title: Testing and verification
  nodes:
  - id: testing.plan-strategy
    title: Plan the testing
    description: Decide what to test, how and when, in line with scope and delivery dates, and write the plan, scenarios and procedures down so they can be repeated.
    sources:
    - ref: ONET
      locator: '15-1253.00 task 14638: Design test plans, scenarios, scripts, or procedures.'
    - ref: ONET
      locator: '15-1253.00 task 14645: Plan test schedules or strategies in accordance with project scope or delivery dates.'
    - ref: ONET
      locator: '15-1253.00 task 14648: Document test procedures to ensure replicability and compliance with standards.'
    - ref: ESCO
      locator: provide software testing documentation
    - ref: S1
      locator: 'Chapter 5: Software Testing'
  - id: testing.test-the-change
    title: Test the change before it goes in
    description: Run the tests that exercise the modification, and execute them at the appropriate levels.
    sources:
    - ref: ONET
      locator: '15-1253.00 task 14639: Test system modifications to prepare for implementation.'
    - ref: ESCO
      locator: execute software tests
    - ref: ESCO
      locator: levels of software testing
  - id: testing.unit-tests
    title: Write unit tests with the code
    description: Add or update unit tests in the same change as the code they cover.
    keywords:
    - unit test
    sources:
    - ref: ESCO
      locator: perform software unit testing
    - ref: S5
      locator: 'What to look for in a code review: Tests'
    - ref: S5
      locator: 'Small CLs: Keep related test code in the same CL'
  - id: testing.regression-and-negative
    title: Cover regression and negative cases
    description: Test that old behaviour still works, that bad inputs fail properly, and that earlier bugs stay fixed.
    keywords:
    - regression
    - edge case
    sources:
    - ref: ONET
      locator: '15-1253.00 task 14640: Develop testing programs that address areas such as database impacts, software scenarios, regression testing, negative testing, error or bug retests, or usability.'
    - ref: ONET
      locator: '15-1252.00 detailed work activity: Develop testing routines or procedures.'
  - id: testing.reproduce-and-report
    title: Reproduce problems and report defects
    description: Reproduce a reported problem, document the defect in the tracker with enough detail, report it, and follow it to resolution.
    keywords:
    - bug report
    - reproduce
    sources:
    - ref: ESCO
      locator: replicate customer software issues
    - ref: ESCO
      locator: report test findings
    - ref: ONET
      locator: '15-1253.00 task 14641: Document software defects, using a bug tracking system, and report defects to software developers.'
    - ref: ONET
      locator: '15-1253.00 task 14642: Identify, analyze, and document problems with program function, output, online screen, or content.'
    - ref: ONET
      locator: '15-1253.00 task 14643: Monitor bug resolution efforts and track successes.'
  - id: testing.automation
    title: Automate tests and keep them current
    description: Put repeatable tests under automation and update the scripts as the software changes.
    keywords:
    - CI tests
    - test suite
    sources:
    - ref: S11
      locator: Test automation
    - ref: ONET
      locator: '15-1253.00 task 14650: Update automated test scripts to ensure currency.'
    - ref: ONET
      locator: '15-1253.00 task 14659: Design or develop automated testing tools.'
  - id: testing.environment-and-data
    title: Test in a realistic environment with suitable data
    description: Recreate the production environment, check compatibility with other systems and platforms, and use test data that represents real cases.
    sources:
    - ref: ONET
      locator: '15-1253.00 task 14656: Install and configure recreations of software production environments to allow testing of software performance.'
    - ref: ONET
      locator: '15-1253.00 task 14655: Conduct software compatibility tests with programs, hardware, operating systems, or network environments.'
    - ref: S11
      locator: Test data management
  - id: testing.security-testing
    title: Test for vulnerabilities
    description: Decide which security tests to run on the executable, scope and run them, and triage what they find.
    keywords:
    - pen test
    - fuzz
    - SAST
    - DAST
    sources:
    - ref: S2
      locator: PW.8 Test Executable Code to Identify Vulnerabilities and Verify Compliance with Security Requirements
    - ref: S2
      locator: 'PW.8.2: Scope the testing, design the tests, perform the testing, and document the results'
  - id: testing.release-criteria
    title: Define when the change is ready to release
    description: Agree the standards and methods that decide product quality and release readiness before testing ends, and analyse results over time.
    keywords:
    - definition of done
    - acceptance
    sources:
    - ref: ONET
      locator: '15-1253.00 task 14649: Develop or specify standards, methods, or procedures to determine product quality or release readiness.'
    - ref: ONET
      locator: '15-1253.00 task 14664: Conduct historical analyses of test results.'
    - ref: ESCO
      locator: software metrics
- id: review
  title: Code review and approval
  nodes:
  - id: review.standard
    title: Hold review to a clear standard
    description: Approve a change when it improves the overall health of the code, and decide disagreements by principle.
    sources:
    - ref: S5
      locator: 'The Standard of Code Review: Principles'
    - ref: S5
      locator: 'The Standard of Code Review: Resolving Conflicts'
    - ref: S2
      locator: 'PW.7.1: Determine whether code review (a person looks directly at the code to find issues) and/or code analysis'
