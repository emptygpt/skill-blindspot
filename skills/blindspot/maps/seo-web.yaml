- id: compliance
  title: "Search policies and advertising disclosure"
  nodes:
  - id: compliance.spam
    title: "Review search spam compliance"
    description: "Check site practices against the search engine's published spam policies."
    sources:
    - ref: G4
      locator: "Spam policies for Google web search"
  - id: compliance.scaled
    title: "Prevent scaled content abuse"
    description: "Review large-scale publishing plans for content created primarily to manipulate search rankings."
    sources:
    - ref: G4
      locator: "Scaled content abuse"
  - id: compliance.link-spam
    title: "Avoid link schemes"
    description: "Review link acquisition and placement practices for search-ranking manipulation."
    sources:
    - ref: G4
      locator: "Link spam"
  - id: compliance.affiliate-value
    title: "Review affiliate page usefulness"
    description: "Identify affiliate pages that add insufficient value beyond the merchant's material."
    sources:
    - ref: G4
      locator: "Thin affiliation"
  - id: compliance.affiliate-disclosure
    title: "Disclose affiliate relationships visibly"
    description: "Require clear commission disclosures near relevant website recommendations rather than treating rel attributes as consumer disclosure."
    sources:
    - ref: F1
      locator: "WHAT ABOUT AFFILIATE OR NETWORK MARKETING?"
  - id: compliance.page-disclosure
    title: "Disclose on affected pages"
    description: "Check sponsored page templates so a home-page-only disclosure cannot leave individual recommendations undisclosed."
    sources:
    - ref: F1
      locator: "Would a single disclosure on my home page that “many products discussed on this site are provided free by their manufacturers” be enough?"
  - id: compliance.cn-identification
    title: "Identify advertising under Chinese law"
    description: "Require applicable website advertising to be recognizable as advertising and separated from non-advertising information."
    sources:
    - ref: L1
      locator: "第十四条"
  - id: compliance.cn-internet
    title: "Review internet advertising presentation"
    description: "For advertising subject to Chinese law, ensure internet ad presentation does not obstruct normal use and pop-ups have a clear one-click close control."
    sources:
    - ref: L1
      locator: "第四十四条"
  - id: compliance.cn-affiliate
    title: "Label applicable shopping-link advertisements"
    description: "For applicable Chinese internet advertisements, review promotional knowledge, experience and review pages with purchase links for conspicuous advertising labels."
    sources:
    - ref: L2
      locator: "第九条"
