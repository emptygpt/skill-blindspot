# skill-blindspot map: SEO and website content operations (maps/seo-web.yaml)
#
# Rules for this map
#   - Every node must cite a fetched source in "sources", with a locator
#     copied from a heading, report name, article number, or short task statement.
#   - Nodes may be merged and reworded, but a node with no source must never
#     be added. Unverified gaps stay in the list below.
#   - Only titles and short statements are cited; no source body text is copied.
#
# Scope and boundaries
#   Site/search-engine operations, not writing a single article's content,
#   reporting or ethics (map writing), or building/changing site code,
#   security, testing or release (map software). Paid search ads (SEM bidding)
#   and social media are out of scope. Technical nodes specify SEO requirements
#   and inspect search outcomes; implementation belongs to software.
#   Overlap with writing's head.metadata-seo and search engine-first content:
#   this map covers metadata consistency across pages, search presentation,
#   and site-level content decisions, not drafting or judging a single article.
#   Advertising nodes cover site publishing controls for sponsored/affiliate
#   pages, not general editorial ethics. Apply legal nodes in their jurisdiction.
#
# Licence and attribution
#   Google Search Central and web.dev: page content is CC BY 4.0 as stated
#   on the pages; code samples are Apache 2.0 and are not copied here.
#   Headings are regrouped and descriptions reworded; this is an adaptation,
#   not endorsed by Google. Search Console Help licence is not verified.
#   O*NET: This product includes information from the O*NET 31.0 Database by
#   the U.S. Department of Labor, Employment and Training Administration
#   (USDOL/ETA). Used under the CC BY 4.0 license. O*NET(R) is a trademark of
#   USDOL/ETA. Task statements are regrouped here, so this map is an adaptation
#   and has not been endorsed by USDOL/ETA. Current version checked at
#   https://www.onetcenter.org/database.html on 2026-11-19.
#   Schema.org, FTC and Chinese law/regulation: licences not verified;
#   only short titles, questions and article numbers are cited.
#
# Not yet covered (no usable source read, so no node)
#   - ESCO search engine optimisation expert skill names: the occupation
#     page returned a temporary-issue shell, not verifiable occupation skills.
#   - Bing-specific webmaster rules: the fetched guidelines URL returned
#     an application shell, not readable guideline text.
#   - Baidu-specific operational rules: only the SEO guide 2.0 preface was
#     read; its historical introduction does not support current workflow nodes.
#   - Step-level editorial refresh schedules, ownership and approval workflows,
#     and consolidation of non-duplicate pages: no detailed source read.
#   - Search engines beyond the cited Google guidance; local business search,
#     ecommerce feed operations, and jurisdiction-specific ad rules beyond
#     the cited US and Chinese guidance: no detailed source read.

map:
  id: seo-web
  title: SEO and website content operations
  version: 0.1.0
  updated: '2026-11-19'
  scope: "Making a website's pages findable and useful in web search and keeping site content healthy: research, crawling/indexing, URL and site structure, titles/meta descriptions/headings, structured data, sitemaps/robots, page experience/Core Web Vitals, mobile, international hreflang, images/video in search, internal and qualified outbound links, helpful/people-first content, site-level updating/consolidating/removing, redirects/site moves, Search Console measurement, spam policies and sponsored/affiliate disclosure and advertising-law compliance. Out of scope: writing a single article's content, reporting or ethics (map writing); building/changing the site's code, security, testing or release (map software); paid search ads (SEM bidding); social media. Overlap with writing metadata and people-first content is limited here to site/search-engine operations."
