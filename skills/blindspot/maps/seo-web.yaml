groups:
- id: strategy
  title: "Strategy and research"
  nodes:
  - id: strategy.intent
    title: "Research audience search intent"
    description: "Combine keyword research and other audience evidence to define which needs the site's pages should satisfy."
    sources:
    - ref: O1
      locator: "Task 20319: Combine secondary data sources with keyword research to more accurately profile and satisfy user intent."
  - id: strategy.terms
    title: "Account for readers' search terms"
    description: "Plan page coverage for the different terms that new and experienced visitors use to find the same subject."
    sources:
    - ref: G2
      locator: "Expect your readers' search terms"
  - id: strategy.competitors
    title: "Research search trends and competitors"
    description: "Compare query trends and competitor performance to identify gaps in the site's organic search coverage."
    sources:
    - ref: O1
      locator: "Task 16186: Conduct market research analysis to identify search query trends, real-time search and news media activity, popular social media topics, electronic commerce trends, market opportunities, or competitor performance."
  - id: strategy.content-strategy
    title: "Define a site content strategy"
    description: "Choose the site's content priorities and page roles before commissioning individual articles."
    sources:
    - ref: O1
      locator: "Task 20321: Create content strategies for digital media."
  - id: strategy.eligibility
    title: "Check search eligibility requirements"
    description: "Establish whether the site's pages meet search technical requirements before planning visibility work."
    sources:
    - ref: G1
      locator: "Technical requirements"
- id: crawl-index
  title: "Crawling and indexing"
  nodes:
  - id: crawl-index.discover
    title: "Check page discovery"
    description: "Identify how search engines can discover the site's public pages."
    sources:
    - ref: G2
      locator: "Help Google find your content"
  - id: crawl-index.render
    title: "Check search engine rendering"
    description: "Inspect whether Google can see the intended page content rather than assuming browser visibility is enough."
    sources:
    - ref: G2
      locator: "Check if Google can see your page the same way a user does"
  - id: crawl-index.robots
    title: "Define crawl controls"
    description: "Decide which resources crawlers may request and review the site's robots.txt rules."
    sources:
    - ref: G10
      locator: "What is a robots.txt file used for?"
  - id: crawl-index.robots-limits
    title: "Distinguish crawl blocking from removal"
    description: "Do not rely on robots.txt alone to keep a URL out of search results or protect private content."
    sources:
    - ref: G10
      locator: "Understand the limitations of a robots.txt file"
  - id: crawl-index.noindex
    title: "Define indexing exclusions"
    description: "Specify which publicly reachable pages should carry noindex and ensure crawlers can read that instruction."
    sources:
    - ref: G21
      locator: "Implementing noindex"
  - id: crawl-index.sitemap
    title: "Plan sitemap coverage"
    description: "Decide whether a sitemap is needed and which discoverable site URLs it should represent."
    sources:
    - ref: G9
      locator: "Do I need a sitemap?"
  - id: crawl-index.sitemap-build
    title: "Maintain sitemaps"
    description: "Keep sitemap URL lists aligned with the pages intended for search discovery."
    sources:
    - ref: G9
      locator: "Build a sitemap"
- id: site-structure
  title: "URL and site structure"
  nodes:
  - id: site-structure.urls
    title: "Use descriptive URLs"
    description: "Choose readable URL paths that indicate the subject of the destination page."
    sources:
    - ref: G2
      locator: "Use descriptive URLs"
  - id: site-structure.directories
    title: "Group related pages"
    description: "Organize related pages into a coherent directory structure."
    sources:
    - ref: G2
      locator: "Group topically similar pages in directories"
  - id: site-structure.duplicates
    title: "Reduce duplicate URL exposure"
    description: "Identify URL variants that expose the same content and choose how they should be handled."
    sources:
    - ref: G2
      locator: "Reduce duplicate content"
  - id: site-structure.canonical
    title: "Choose canonical destinations"
    description: "Select the preferred URL for duplicate or very similar pages and align canonical signals."
    sources:
    - ref: G11
      locator: "Reasons to specify a canonical URL"
  - id: site-structure.canonical-signals
    title: "Align canonical methods"
    description: "Keep redirects, canonical annotations and sitemap preferences consistent."
    sources:
    - ref: G11
      locator: "Comparison of canonicalization methods"
- id: on-page
  title: "Search-facing page metadata and headings"
  nodes:
  - id: on-page.titles
    title: "Maintain descriptive title links"
    description: "Review page titles across the site for accurate and distinct search-result identification."
    sources:
    - ref: G5
      locator: "Best practices for influencing title links"
  - id: on-page.main-heading
    title: "Make the main page title clear"
    description: "Check that each page has an unambiguous main heading that agrees with its search-facing title."
    sources:
    - ref: G5
      locator: "No clear main title"
  - id: on-page.stale-titles
    title: "Correct outdated title metadata"
    description: "Find title elements that no longer match a page's current content or date."
    sources:
    - ref: G5
      locator: "Obsolete <title> elements"
  - id: on-page.descriptions
    title: "Maintain unique meta descriptions"
    description: "Give important pages distinct summaries that help searchers distinguish their purpose."
    sources:
    - ref: G6
      locator: "Create unique descriptions for each page on your site"
  - id: on-page.snippet-controls
    title: "Control snippet exposure"
    description: "Specify when search snippets should be suppressed or limited for a page."
    sources:
    - ref: G6
      locator: "How to prevent snippets or adjust snippet length"
- id: structured-data
  title: "Structured data"
  nodes:
  - id: structured-data.eligibility
    title: "Choose relevant search features"
    description: "Identify supported structured data features appropriate to the actual page content without promising rich results."
    sources:
    - ref: G7
      locator: "How structured data works in Google Search"
  - id: structured-data.vocabulary
    title: "Choose schema types and properties"
    description: "Match the page's entities and attributes to appropriate schema.org types and properties."
    sources:
    - ref: S1
      locator: "2a. schema.org types and properties"
  - id: structured-data.format
    title: "Specify a supported format"
    description: "Choose a structured data format supported by the target search engine."
    sources:
    - ref: G7
      locator: "Supported formats"
  - id: structured-data.visible-content
    title: "Match markup to visible content"
    description: "Require structured data to describe the content visitors can actually find on the page."
    sources:
    - ref: G8
      locator: "Content"
  - id: structured-data.complete
    title: "Check required information"
    description: "Review structured data completeness for the intended search feature."
    sources:
    - ref: G8
      locator: "Completeness"
  - id: structured-data.validation
    title: "Check markup validity"
    description: "Validate the planned structured data and route code defects to the software workflow."
    sources:
    - ref: S1
      locator: "2c. Testing your markup"
- id: page-experience
  title: "Page experience and mobile"
  nodes:
  - id: page-experience.review
    title: "Assess search landing-page experience"
    description: "Review usability problems across search landing pages and route implementation work to the software workflow."
    sources:
    - ref: G13
      locator: "Self-assess your content's page experience"
  - id: page-experience.cwv
    title: "Monitor Core Web Vitals"
    description: "Track loading, responsiveness and visual stability as distinct visitor-experience concerns."
    sources:
    - ref: W1
      locator: "Core Web Vitals"
  - id: page-experience.field
    title: "Use field performance evidence"
    description: "Assess real-user Core Web Vitals rather than treating a single lab run as the site's experience."
    sources:
    - ref: W1
      locator: "Field tools to measure Core Web Vitals"
  - id: page-experience.mobile
    title: "Review mobile usability"
    description: "Ensure the site's search landing pages remain useful on mobile devices."
    sources:
    - ref: G14
      locator: "Create a mobile-friendly site"
  - id: page-experience.mobile-parity
    title: "Maintain mobile content parity"
    description: "Check that mobile pages expose the same important content as desktop pages."
    sources:
    - ref: G14
      locator: "Make sure that content is the same on desktop and mobile"
  - id: page-experience.mobile-access
    title: "Review mobile crawl access"
    description: "Identify mobile resources or content that Google cannot access or render."
    sources:
    - ref: G14
      locator: "Make sure that Google can access and render your content"
  - id: page-experience.ads
    title: "Limit distracting advertisements"
    description: "Review ad placement for interference with visitors using search landing pages."
    sources:
    - ref: G2
      locator: "Avoid distracting advertisements"
- id: international
  title: "International search"
  nodes:
  - id: international.alternates
    title: "Identify localized page equivalents"
    description: "Map language and regional alternatives before specifying hreflang relationships."
    sources:
    - ref: G12
      locator: "Methods for indicating your alternate pages"
  - id: international.hreflang
    title: "Check alternate-page annotations"
    description: "Review reciprocal hreflang references and consistency across localized page sets."
    sources:
    - ref: G12
      locator: "Guidelines for all methods"
  - id: international.codes
    title: "Use supported locale codes"
    description: "Specify valid language and optional region codes for localized search targeting."
    sources:
    - ref: G12
      locator: "Supported language and region codes"
  - id: international.fallback
    title: "Define unmatched-language destinations"
    description: "Identify an appropriate x-default destination when the site offers a language fallback."
    sources:
    - ref: G12
      locator: "Use the x-default value for unmatched languages"
- id: media
  title: "Images and video in search"
  nodes:
  - id: media.image-discovery
    title: "Make images discoverable"
    description: "Check that search engines can find the site's important image resources."
    sources:
    - ref: G15
      locator: "Help us discover and index your images"
  - id: media.image-context
    title: "Describe images for search context"
    description: "Review image filenames, titles and alt text in the context of their landing pages."
    sources:
    - ref: G15
      locator: "Use descriptive filenames, titles, and alt text"
  - id: media.image-performance
    title: "Balance image speed and quality"
    description: "Identify image delivery problems affecting search landing-page quality and request implementation changes separately."
    sources:
    - ref: G15
      locator: "Optimize for speed and quality"
  - id: media.video-pages
    title: "Provide dedicated video watch pages"
    description: "Give important videos a discoverable page where watching the video is the main purpose."
    sources:
    - ref: G16
      locator: "Create a dedicated watch page for each video"
  - id: media.video-thumbnails
    title: "Maintain video thumbnails"
    description: "Provide stable, accessible, high-quality thumbnails for videos intended to appear in search."
    sources:
    - ref: G16
      locator: "Provide a high-quality video thumbnail"
  - id: media.video-files
    title: "Allow video retrieval"
    description: "Check that search engines can fetch video files intended for search indexing."
    sources:
    - ref: G16
      locator: "Allow Google to fetch your video files"
- id: links
  title: "Internal and outbound links"
  nodes:
  - id: links.crawlable
    title: "Check link crawlability"
    description: "Review whether navigational links expose destinations in a form Google can crawl."
    sources:
    - ref: G19
      locator: "Make your links crawlable"
  - id: links.internal
    title: "Connect related site pages"
    description: "Use internal links so visitors and crawlers can reach relevant pages within the site."
    sources:
    - ref: G19
      locator: "Internal links: cross-reference your own content"
  - id: links.anchors
    title: "Use descriptive anchor text"
    description: "Make link labels explain their destinations in the surrounding page context."
    sources:
    - ref: G19
      locator: "Write good anchor text"
  - id: links.sponsored
    title: "Qualify paid links"
    description: "Require sponsored or affiliate outbound links to use the appropriate search-engine relationship attribute in addition to visible disclosures."
    sources:
    - ref: G20
      locator: "rel=\"sponsored\""
  - id: links.ugc
    title: "Qualify user-generated links"
    description: "Define when links supplied by site users should carry the ugc relationship."
    sources:
    - ref: G20
      locator: "rel=\"ugc\""
  - id: links.nofollow
    title: "Use nofollow deliberately"
    description: "Decide when an outbound link should not imply association with its destination."
    sources:
    - ref: G20
      locator: "rel=\"nofollow\""
- id: content-ops
  title: "Site-level content operations"
  nodes:
  - id: content-ops.portfolio-review
    title: "Review the content portfolio"
    description: "Assess existing pages for usefulness and quality to decide which need substantive updates."
    sources:
    - ref: G3
      locator: "Self-assess your content"
  - id: content-ops.people-first
    title: "Keep site priorities people-first"
    description: "Evaluate site-wide content decisions against audience needs rather than creating pages primarily to attract search visits."
    sources:
    - ref: G3
      locator: "Avoid creating search engine-first content"
  - id: content-ops.freshness
    title: "Avoid cosmetic freshness changes"
    description: "Require substantive reasons for date changes and content additions or removals rather than chasing a site freshness signal."
    sources:
    - ref: G3
      locator: "Avoid creating search engine-first content"
