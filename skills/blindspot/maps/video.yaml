# skill-blindspot map: video production (maps/video.yaml)
#
# Rules for this map
#   - Every node must cite at least one source that really exists in the
#     "sources" list, with a locator copied from that source: a section or
#     chapter title, an O*NET task sentence (may be shortened), or an ESCO
#     skill name.
#   - Nodes may be merged and reworded, but a node with no source must never
#     be added. Gaps that no source covers are recorded elsewhere, not as nodes.
#   - Sources are only cited for titles and short task statements; no body
#     text of the platform pages, syllabi or textbooks is copied.
#
# Licence and attribution
#   O*NET: This product includes information from the O*NET 31.0 Database by
#   the U.S. Department of Labor, Employment and Training Administration
#   (USDOL/ETA). Used under the CC BY 4.0 license. O*NET(R) is a trademark of
#   USDOL/ETA. The task statements are shortened and regrouped here, so this
#   map is an adaptation and has not been endorsed by USDOL/ETA.
#   ESCO: This publication uses the ESCO classification of the European
#   Commission. ESCO skill names are regrouped here, so this map is an
#   adaptation of ESCO. https://esco.ec.europa.eu
#   All other sources (platform pages, syllabi, textbooks): only titles and
#   section headings are cited; their licences are not verified.
#
# Sources added in 0.2.0 (read 2026-11-17)
#   Bilibili creator academy course titles and Bilibili community convention
#   headings (B1-B10, login required); Douyin community self-discipline
#   convention (D1) and Douyin rule centre rule-document list (D2). Only titles
#   and short phrases are cited. Courses by individual uploaders were not used.
#   Not read: the Douyin creator learning centre (login by phone or QR code).

map:
  id: video
  title: Video production
  version: 0.2.0
  updated: 2026-11-17
  scope: "Online video made for platforms such as YouTube, Bilibili and short-video apps: explainers, reviews and shorts, from choosing a topic to publishing and reviewing results. Out of scope: live broadcast and studio switching, feature film financing, casting, distribution deals and managing a film crew."

