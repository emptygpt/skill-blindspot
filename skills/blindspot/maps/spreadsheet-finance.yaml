# skill-blindspot map: spreadsheet modeling and financial analysis (maps/spreadsheet-finance.yaml)
#
# Rules for this map
#   - Every node cites a verified source title, heading or short task statement;
#     O*NET task locators include the Task ID seen in the page's form.
#   - Nodes may be merged and reworded; a node with no source never goes in.
#   - Only titles and short statements are cited, never source body text.
#   - Prose quality of a memo/report belongs to the writing map.
#   - Engineering practice of VBA/Python/Office Script code (tests, version
#     control of code, dependencies, security of code) belongs to software.
#     This map keeps spreadsheet/finance-specific concerns, including workbook
#     change control, formula auditing, presentation and accounting compliance.
#
# Licence and attribution
#   O*NET: This product includes information from the O*NET 31.0 Database by
#   the U.S. Department of Labor, Employment and Training Administration
#   (USDOL/ETA). Used under the CC BY 4.0 license:
#   https://creativecommons.org/licenses/by/4.0/
#   O*NET(R) is a trademark of USDOL/ETA. Task statements are shortened and
#   regrouped here; skill-blindspot has modified this information. USDOL/ETA
#   has not approved, endorsed, or tested these modifications.
#   ICAEW, Microsoft, IFRS Foundation and CFA Institute: licences not verified;
#   only titles, headings and short statements are cited. Descriptions are
#   independently worded. IFRS citations use public summaries, not full clauses.
#   CFA standards titles identify general ethical concerns, not a claim that
#   every spreadsheet user is subject to CFA Institute membership duties.
#
# Not yet covered (no verified source locator for these details, so no node)
#   - Units, currency and sign conventions beyond basic number formatting.
#   - Named ranges, date arithmetic and financial-function timing conventions.
#   - Detailed three-statement schedules, discounted cash-flow mechanics and
#     budgeting methods beyond scenario comparison and general forecasting.
#   - XBRL and Inline XBRL tagging: attempted specification fetch returned no
#     readable content; taxonomy and filing validation are not covered.
#   - OOXML/file-format interoperability and Spreadsheet Compare procedures.
#   - China enterprise accounting standards and jurisdiction-specific rules.
#   - Detailed IFRS clauses: only the public IAS 1 / IFRS 18 overviews were read.
#   - FAST Standard, ICAEW Financial Modelling Code and EuSpRIG methods were
#     not read; this map uses ICAEW's public twenty spreadsheet principles.
#
map:
  id: spreadsheet-finance
  title: 'Spreadsheet modeling and financial analysis'
  version: 0.1.0
  updated: '2026-11-19'
  scope: 'Building or changing a spreadsheet model or financial analysis (forecasts, budgets, valuation, financial statement analysis and derived reports), from the question through inputs, structure, formulas, checks, scenarios, outputs, review, documentation and disclosure. Prose quality of a memo/report belongs to the writing map; engineering practice of VBA/Python/Office Script code (tests, version control of code, dependencies, security of code) belongs to the software map. This map retains spreadsheet/finance-specific concerns such as workbook change control, formula auditing, number formats and financial statement presentation requirements. Out of scope: bookkeeping and audit engagements, tax filing, regulated investment advice specifics and general data science.'
