groups:
- id: purpose
  title: 'Question, purpose and requirements'
  nodes:
  - id: purpose.question
    title: 'Define the analytical question'
    description: 'State the question and the decisions the spreadsheet must support.'
    sources:
    - ref: S1
      locator: '5. Focus on the purposes of the spreadsheet.'
  - id: purpose.audience
    title: 'Identify users and downstream requirements'
    description: 'Identify who will use the workbook and what dependent processes require from its outputs.'
    sources:
    - ref: S1
      locator: '6. Tailor the design and documentation to the needs of the audience and dependent processes.'
  - id: purpose.tool-fit
    title: 'Confirm spreadsheet suitability'
    description: 'Check that a spreadsheet and the available skills are appropriate for the calculation and data volume.'
    sources:
    - ref: S1
      locator: '4. Determine if a spreadsheet is a suitable tool.'
  - id: purpose.risk
    title: 'Set risk-proportionate controls'
    description: 'Identify critical workbooks and scale their checks and review to the consequences of error.'
    sources:
    - ref: S1
      locator: '1. Determine how much your organisation depends on spreadsheets and plan your approach and processes accordingly.'
  - id: purpose.competence
    title: 'Check modeller and user competence'
    description: 'Identify spreadsheet knowledge needed to build, operate and maintain the model.'
    sources:
    - ref: S1
      locator: '3. Ensure designers and users of spreadsheets have appropriate knowledge, competence, experience, and awareness of functionality.'
- id: inputs
  title: 'Data inputs and assumptions'
  nodes:
  - id: inputs.quality
    title: 'Clean and structure inputs'
    description: 'Check and reshape incoming data before feeding it into calculations.'
    sources:
    - ref: S1
      locator: '10. Seek to control, clean, and optimise data quality and structure prior to using them.'
  - id: inputs.assumptions
    title: 'Explain assumptions and logic'
    description: 'Document assumptions and calculation logic so another user can interpret the model.'
    sources:
    - ref: S1
      locator: '6. Tailor the design and documentation to the needs of the audience and dependent processes.'
  - id: inputs.validation
    title: 'Constrain input values'
    description: 'Set appropriate lists, ranges and date restrictions for editable input cells.'
    sources:
    - ref: S4
      locator: 'When is data validation useful?'
  - id: inputs.messages
    title: 'Explain invalid inputs'
    description: 'Provide input guidance and choose error alerts appropriate to invalid entries.'
    sources:
    - ref: S4
      locator: 'Data Validation Input and Error Messages'
  - id: inputs.inherited-validation
    title: 'Review inherited validation'
    description: 'Inspect and update validation rules when changing an existing workbook.'
    sources:
    - ref: S4
      locator: 'How to update or remove data validation in an inherited workbook'
  - id: inputs.sourcing
    title: 'Source financial context'
    description: 'Identify the publications, company information and economic data underpinning the analysis.'
    sources:
    - ref: S2
      locator: 'Task ID 21596: Monitor fundamental economic, industrial, and corporate developments by analyzing information'
- id: structure
  title: 'Model structure and layout'
  nodes:
  - id: structure.flow
    title: 'Separate inputs, calculations and outputs'
    description: 'Arrange workbook sections in an auditable flow with each input entered once.'
    sources:
    - ref: S1
      locator: '9. Structure workbooks with a clear flow of inputs, processes, and outputs.'
  - id: structure.layout
    title: 'Use consistent worksheet layouts'
    description: 'Keep comparable worksheets and periods organised consistently.'
    sources:
    - ref: S1
      locator: '11. Structure worksheets to avoid inconsistent logic and layout.'
  - id: structure.adaptability
    title: 'Allow for model growth'
    description: 'Design ranges and tables to accommodate foreseeable additions without manual formula repairs.'
    sources:
    - ref: S1
      locator: '8. Design with adaptability in mind to minimise future manual intervention.'
  - id: structure.conventions
    title: 'Apply workbook conventions'
    description: 'Use consistent spreadsheet formatting conventions and document workbook-specific conventions for users.'
    sources:
    - ref: S1
      locator: '2. Adopt a consistent methodology for spreadsheets in your organisation.'
    - ref: S1
      locator: '7. Make the spreadsheet easy to use, providing supporting guidance where helpful.'
  - id: structure.guidance
    title: 'Document workbook operation'
    description: 'Provide workbook purpose, owner, version and operating guidance for the next user.'
    sources:
    - ref: S1
      locator: '7. Make the spreadsheet easy to use, providing supporting guidance where helpful.'
- id: formulas
  title: 'Formulas and functions'
  nodes:
  - id: formulas.consistent
    title: 'Keep formulas consistent'
    description: 'Maintain consistent formula patterns across comparable ranges and investigate exceptions.'
    sources:
    - ref: S1
      locator: '12. Keep formulas consistent across ranges.'
  - id: formulas.simple
    title: 'Choose simple formulas'
    description: 'Use the simplest suitable spreadsheet features and functions.'
    sources:
    - ref: S1
      locator: '13. Use the simplest features, functions, or formulas for the task.'
  - id: formulas.constants
    title: 'Keep changeable values out of formulas'
    description: 'Put changeable assumptions in identified input cells rather than embedding them in calculations.'
    sources:
    - ref: S1
      locator: '14. Avoid using fixed values within formulas.'
  - id: formulas.reuse
    title: 'Reuse calculated results'
    description: 'Reference an existing result instead of calculating the same quantity repeatedly.'
    sources:
    - ref: S1
      locator: '15. Refer to existing calculated results instead of reperforming the calculation.'
  - id: formulas.references
    title: 'Select reference behaviour'
    description: 'Choose relative, absolute or mixed references deliberately before copying formulas.'
    sources:
    - ref: S3
      locator: 'The difference between absolute, relative, and mixed references'
  - id: formulas.sheet-changes
    title: 'Check worksheet reference changes'
    description: 'Check formula references after moving, copying, inserting or deleting worksheets.'
    sources:
    - ref: S3
      locator: 'What occurs when you move, copy, insert, or delete worksheets'
  - id: formulas.function-use
    title: 'Check function arguments'
    description: 'Choose a suitable built-in function and supply arguments matching its intended calculation.'
    sources:
    - ref: S3
      locator: 'Enter a formula that contains a built-in function'
  - id: formulas.errors
    title: 'Handle formula errors explicitly'
    description: 'Specify the value returned when a formula evaluates to an error.'
    sources:
    - ref: S7
      locator: 'IFERROR returns a value you specify if a formula evaluates to an error; otherwise, it returns the result of the formula.'
  - id: formulas.rounding
    title: 'Set calculation rounding'
    description: 'Specify where values are rounded in calculations and to how many digits.'
    sources:
    - ref: S9
      locator: 'The ROUND function rounds a number to a specified number of digits.'
- id: checks
  title: 'Checks, testing and review'
  nodes:
  - id: checks.built-in
    title: 'Build visible model checks'
    description: 'Include reconciliation and balance checks with alerts for failed model relationships.'
    sources:
    - ref: S1
      locator: '17. Build in checks, controls, and alerts from the outset.'
  - id: checks.test
    title: 'Test workbook behaviour'
    description: 'Vary inputs, test extreme or impossible values and systematically double-check key calculations.'
    sources:
    - ref: S1
      locator: '18. Test and review to reduce the risk of error and identify inefficiencies.'
  - id: checks.peer-review
    title: 'Arrange independent workbook review'
    description: 'Have another competent person review workbook design and calculations.'
    sources:
    - ref: S1
      locator: '16. Collaborate in design and review processes. This ensures accuracy, robustness, and the mitigation of risks.'
    - ref: S1
      locator: '18. Test and review to reduce the risk of error and identify inefficiencies.'
  - id: checks.evaluate
    title: 'Audit nested formulas'
    description: 'Use stepwise formula evaluation to inspect intermediate results and logical branches.'
    sources:
    - ref: S8
      locator: 'Select Evaluate to examine the value of the underlined reference.'
- id: scenarios
  title: 'Scenarios and sensitivity'
  nodes:
  - id: scenarios.cases
    title: 'Compare coherent scenarios'
    description: 'Define alternative sets of assumptions and compare their resulting budgets or forecasts.'
    sources:
    - ref: S5
      locator: 'Use scenarios to consider many different variables'
  - id: scenarios.sensitivity
    title: 'Vary key drivers'
    description: 'Use one- or two-variable data tables to examine output sensitivity to selected inputs.'
    sources:
    - ref: S5
      locator: 'Use Data Tables to see the effects of one or two variables on a formula'
  - id: scenarios.target
    title: 'Solve for a target result'
    description: 'Use Goal Seek to find the single input value needed for a formula to produce a specified result.'
    sources:
    - ref: S5
      locator: 'Use Goal Seek to find out how to get a desired result'
  - id: scenarios.forecast
    title: 'Choose forecast approach'
    description: 'Generate forecast values from existing data using a suitable trend calculation or worksheet function.'
    sources:
    - ref: S5
      locator: 'Prepare forecasts and advanced business models'
- id: analysis
  title: 'Financial analysis'
  nodes:
  - id: analysis.impact
    title: 'Model financial impact'
    description: 'Translate the financial question into a model of the transaction or proposed change.'
    sources:
    - ref: S2
      locator: 'Task ID 21590: Employ financial models to develop solutions to financial problems or to assess the financial or capital impact of transactions.'
  - id: analysis.valuation
    title: 'Perform valuation'
    description: 'Calculate a valuation or price for the securities being analysed.'
    sources:
    - ref: S2
      locator: 'Task ID 21597: Perform securities valuation or pricing.'
  - id: analysis.ratios
    title: 'Interpret financial ratios'
    description: 'Calculate and interpret activity, liquidity, solvency and profitability ratios.'
    sources:
    - ref: S12
      locator: 'calculate and interpret activity, liquidity, solvency, and profitability ratios;'
  - id: analysis.comparisons
    title: 'Compare financial performance'
    description: 'Choose meaningful peer and historical comparisons rather than interpreting isolated numbers.'
    sources:
    - ref: S12
      locator: 'Cross-sectional analysis compares multiple companies at the same point in time or over the same range of time, and trend or time-series analysis compares measures for a single company over a period of time.'
  - id: analysis.statements
    title: 'Check financial statement presentation'
    description: 'Check that the financial statements include the complete annual set and preceding-year comparatives.'
    applies_when: 'When preparing or analysing IFRS financial statements before IFRS 18 applies.'
    sources:
    - ref: S10
      locator: 'It requires an entity to present a complete set of financial statements at least annually, with comparative amounts for the preceding year (including comparative amounts in the notes).'
  - id: analysis.ifrs18
    title: 'Determine applicable IFRS presentation standard'
    description: 'Determine whether IFRS 18 applies for the reporting period, including any early adoption, before selecting presentation requirements.'
    applies_when: 'When preparing or analysing IFRS financial statements; IFRS 18 is effective for annual periods beginning on or after 1 January 2027, with earlier application permitted.'
    sources:
    - ref: S11
      locator: 'IFRS 18 is effective for annual reporting periods beginning on or after 1 January 2027, with earlier application permitted.'
- id: reporting
  title: 'Outputs and disclosure'
  nodes:
  - id: reporting.charts
    title: 'Chart financial results'
    description: 'Use spreadsheet charts to illustrate analytical results and relevant comparisons.'
    sources:
    - ref: S2
      locator: 'Task ID 21589: Draw charts and graphs, using computer spreadsheets, to illustrate technical reports.'
  - id: reporting.formats
    title: 'Format financial quantities'
    description: 'Use number formats to distinguish currencies, percentages and dates.'
    sources:
    - ref: S6
      locator: 'Apply a number format'
  - id: reporting.results
    title: 'Present analytical findings'
    description: 'Present the financial conclusions and their supporting results to the intended audience.'
    sources:
    - ref: S2
      locator: 'Task ID 21600: Present oral or written reports on general economic trends, individual corporations, and entire industries.'
  - id: reporting.disclosure
    title: 'Check IFRS 18 disclosure requirements'
    description: 'Check applicable requirements for management-defined performance measures and aggregation in the reporting output.'
    applies_when: 'When IFRS 18 applies.'
    sources:
    - ref: S11
      locator: 'requiring an entity to disclose management-defined performance measures'
    - ref: S11
      locator: 'adding new principles for aggregation and disaggregation of items.'
- id: controls
  title: 'Workbook controls'
  nodes:
  - id: controls.backup-version
    title: 'Control workbook versions and backups'
    description: 'Back up workbooks regularly and distinguish the latest file from previous versions.'
    sources:
    - ref: S1
      locator: '19. Ensure there is a regular process of backup and version control. This minimises loss of work and avoids the use of the wrong version.'
  - id: controls.protection
    title: 'Control workbook access and editing'
    description: 'Restrict workbook access and protect calculation cells against unintended or unauthorised changes.'
    sources:
    - ref: S1
      locator: '20. Manage access levels and protection to reduce the risk of accidental or malicious changes.'
- id: ethics
  title: 'Ethics and compliance'
  nodes:
  - id: ethics.objectivity
    title: 'Maintain analytical objectivity'
    description: 'Keep model assumptions and conclusions independent of pressure for a preferred result.'
    sources:
    - ref: S13
      locator: 'Standard I(B) Independence and Objectivity'
  - id: ethics.misrepresentation
    title: 'Avoid misleading analysis'
    description: 'Do not misrepresent model results, assumptions or limitations.'
    sources:
    - ref: S13
      locator: 'Standard I(C) Misrepresentation'
  - id: ethics.confidentiality
    title: 'Preserve confidentiality'
    description: 'Control sharing of confidential financial inputs and workbook outputs.'
    sources:
    - ref: S13
      locator: 'Standard III(E) Preservation of Confidentiality'
  - id: ethics.records
    title: 'Retain supporting records'
    description: 'Retain the financial evidence and analysis supporting reported conclusions.'
    sources:
    - ref: S13
      locator: 'Standard V(C) Record Retention'
