      locator: '27-3043.00 task: Edit or rewrite existing written material as necessary, and submit written material for approval by supervisor, editor, or publisher.'
    - ref: ONET
      locator: '27-3041.00 task: Make manuscript acceptance or revision recommendations to the publisher.'
  - id: publish.schedule
    title: Set the publishing schedule
    description: Decide the release date and keep to deadline and budget.
