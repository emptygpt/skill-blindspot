      locator: '27-3041.00 task: Oversee publication production, including artwork, layout, computer typesetting, and printing, ensuring adherence to deadlines and budget requirements.'
    - ref: ESCO
      locator: publishing strategy
  - id: publish.promote
    title: Share and promote the piece
    description: Post the piece on the site and social channels and tell readers it exists.
    sources:
    - ref: ONET
      locator: '27-3031.00 task: Post and update content on the company''s Web site and social media outlets.'
    - ref: ESCO
      locator: promote your writings
    - ref: ESCO
      locator: apply social media marketing
- id: feedback
  title: Feedback and follow-up
  nodes:
  - id: feedback.corrections
    title: Correct mistakes openly
    description: Fix errors promptly, say what was wrong, and follow a written corrections policy.
    sources:
    - ref: S1
      locator: Acknowledge mistakes. Correct them promptly and prominently.
    - ref: S3
      locator: Correcting Mistakes
    - ref: S2
      locator: A commitment to an Open & Honest Corrections Policy
    - ref: S2
      locator: Signatories publish their corrections policy and follow it scrupulously.
  - id: feedback.reader-response
    title: Answer readers
    description: Respond to reader questions, requests and criticism.
    sources:
    - ref: S1
      locator: Listen respectfully while encouraging a civil dialogue with the public, and respond quickly to legitimate questions, concerns and criticism.
    - ref: ONET
      locator: '27-3023.00 task: Communicate with readers, viewers, advertisers, or the general public via mail, email, or telephone.'
    - ref: ESCO
      locator: follow up online user requests
  - id: feedback.moderation
    title: Moderate comments
    description: Remove abusive comments and keep the discussion civil.
    applies_when: comments are open
    sources:
    - ref: ESCO
      locator: online moderation techniques
  - id: feedback.analytics
    title: Review performance data
    description: Look at readership data to learn what worked.
    applies_when: published online
    sources:
    - ref: ESCO
      locator: perform online data analysis
    - ref: ESCO
      locator: research website users
  - id: feedback.update-older
    title: Update older pieces
    description: Revise published pieces when facts change, without faking a fresh date.
    sources:
    - ref: ONET
      locator: '27-3042.00 task: Analyze developments in specific field to determine need for revisions in previously published materials and development of new material.'
    - ref: S1
      locator: Gather, update and correct information throughout the life of a news story.
    - ref: S5
      locator: Are you changing the date of pages to make them seem fresh when the content has not substantially changed?
- id: compliance
  title: Ethics and compliance
  nodes:
  - id: comp.minimize-harm
    title: Weigh harm to people
    description: Balance the public's need to know against harm to the people named.
    sources:
    - ref: S1
      locator: Minimize Harm
    - ref: S3
      locator: '5: Harm and Offence'
  - id: comp.privacy
    title: Protect private information
    description: Think before publishing personal details of private people.
    sources:
    - ref: S1
      locator: Weigh the consequences of reporting or amplifying personal information.
    - ref: S3
      locator: '7: Privacy'
  - id: comp.vulnerable-subjects
    title: Take extra care with vulnerable people
    description: Be careful with victims, minors and people unable to give consent.
    applies_when: the piece involves victims, minors or people unable to consent
    sources:
    - ref: S1
      locator: Use heightened sensitivity when dealing with crime victims
    - ref: S3
      locator: '9: Children and Young People as Contributors'
  - id: comp.conflicts
    title: Disclose conflicts of interest
    description: Avoid conflicts, and state those that cannot be avoided.
    sources:
    - ref: S1
      locator: Avoid conflicts of interest, real or perceived.
    - ref: S3
      locator: '4: Conflicts of Interest'
    - ref: S3
      locator: '15: Independence from Commercial and other External Interests'
  - id: comp.sponsored-disclosure
    title: Label sponsored content and brand ties
    description: Tell readers about payment, free products or other ties to a brand.
    applies_when: sponsored, affiliate or gifted content
    sources:
    - ref: S1
      locator: Prominently label sponsored content and partnerships.
    - ref: S6
      locator: When to Disclose
    - ref: S6
      locator: How to Disclose
    - ref: S3
      locator: '16: External Relationships, including Commercial Relationships, and Financing'
  - id: comp.stereotypes
    title: Avoid stereotyping
    description: Check the text for stereotypes of groups.
    sources:
    - ref: S1
      locator: Avoid stereotyping.
  - id: comp.law
    title: Check legal risks
    description: Check the piece against press law, such as defamation, before release.
    applies_when: the piece names people or organisations or makes allegations
    sources:
    - ref: ESCO
      locator: press law
    - ref: S3
      locator: '18: The Law'
  - id: comp.ai-disclosure
    title: Disclose AI use
    description: Tell readers when AI helped produce the piece.
    applies_when: AI tools are used to research, draft or edit
    sources:
    - ref: S3
      locator: Any use of AI by the BBC must be transparent and clear to the audience.
    - ref: S5
      locator: Is the use of automation, including AI-generation, self-evident to visitors through disclosures or in other ways?
    - ref: S1
      locator: Clearly identify the sources and technology that shape the creation of news.
  - id: comp.ai-accuracy
    title: Check AI output for errors
    description: Check anything an AI tool produced for invented or wrong content.
    applies_when: AI tools are used to research, draft or edit
    sources:
    - ref: S3
      locator: Use of Automated Technology and Artificial Intelligence
    - ref: S3
      locator: content or answers that appear plausible but are not necessarily factually accurate – often known as hallucinations
    - ref: S1
      locator: Remember that speed, technology or medium do not excuse inaccuracy or unfairness.
  - id: comp.honest-authorship
    title: Do not fake authorship
    description: Do not invent authors, profiles or credentials.
    sources:
    - ref: S5
      locator: avoid using deceptive authorship information
    - ref: S5
      locator: Fabricating creator profiles
