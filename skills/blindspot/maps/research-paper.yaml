groups:
- id: design
  title: Study design and registration
  nodes:
  - id: design.question
    title: "Research question"
    description: "Define the knowledge gap and a specific objective or hypothesis that the study can address."
    sources:
    - ref: S1
      locator: "c. Introduction"
  - id: design.method
    title: "Scientific approach"
    description: "Choose an empirical approach that can produce evidence relevant to the question."
    sources:
    - ref: S15
      locator: "perform scientific research"
  - id: design.study-plan
    title: "Study plan"
    description: "Plan the investigation and the methods needed to answer the research question."
    applies_when: "Medical or health-related investigations."
    sources:
    - ref: S14
      locator: "Task 7513: Plan and direct studies to investigate human or animal disease, preventive methods, and treatments for disease."
  - id: design.outcomes
    title: "Primary and secondary outcomes"
    description: "Specify the main and secondary outcomes and how they will be measured."
    sources:
    - ref: S1
      locator: "ii. Data Collection and Measurements"
  - id: design.participants
    title: "Selection and exclusions"
    description: "Define the population, eligibility criteria and exclusions and explain sample representativeness."
    applies_when: "Studies involving participants or sampled populations."
    sources:
    - ref: S1
      locator: "i. Selection and Description of Participants"
  - id: design.preregistration
    title: "Study and analysis preregistration"
    description: "Record the study and analysis plan prospectively in a public repository and provide registration details with submission."
    applies_when: "Studies using preregistration or venues that request it."
    sources:
    - ref: S10
      locator: "Pre-registration"
  - id: design.trial-registration
    title: "Prospective trial registration"
    description: "Register a clinical trial in an accepted public registry before the first participant consents to enrollment."
    applies_when: "Clinical trials."
    sources:
    - ref: S4
      locator: "1. Registration"
- id: ethics
  title: Ethics and research integrity
  nodes:
  - id: ethics.approval
    title: "Independent ethics approval"
    description: "Obtain applicable independent review approval and retain documentation for the journal."
    applies_when: "Human research."
    sources:
    - ref: S3
      locator: "E. Protection of Research Participants"
  - id: ethics.publication-consent
    title: "Consent for identifiable publication"
    description: "Obtain and archive written publication consent before including essential identifying patient information."
    applies_when: "Publication of potentially identifiable patient information."
    sources:
    - ref: S3
      locator: "E. Protection of Research Participants"
  - id: ethics.privacy
    title: "Participant privacy"
    description: "Remove unnecessary identifying details without changing the scientific meaning of the evidence."
    applies_when: "Research reports containing personal information."
    sources:
    - ref: S3
      locator: "E. Protection of Research Participants"
  - id: ethics.animal-welfare
    title: "Animal welfare compliance reporting"
    description: "Report compliance with applicable institutional and national animal care standards."
    applies_when: "Animal experiments."
    sources:
    - ref: S3
      locator: "E. Protection of Research Participants"
  - id: ethics.misconduct
    title: "Fabrication, falsification and plagiarism checks"
    description: "Check that evidence is genuine, attribution is accurate and images have not been deceptively manipulated."
    sources:
    - ref: S6
      locator: "B. Scientific Misconduct"
  - id: ethics.ai-disclosure
    title: "AI assistance disclosure and accountability"
    description: "Disclose how AI tools contributed to the work and have humans check the accuracy, originality and attribution of their outputs."
    applies_when: "AI-assisted preparation or conduct of research."
    sources:
    - ref: S2
      locator: "4. Artificial Intelligence (AI)-Assisted Technology"
- id: data
  title: FAIR data stewardship
  nodes:
  - id: data.discovery
    title: "Dataset identification and discovery"
    description: "Assign persistent dataset identifiers and register the data and metadata in a searchable resource."
    sources:
    - ref: S9
      locator: "F1"
    - ref: S9
      locator: "F4"
  - id: data.documentation
    title: "Metadata and provenance"
    description: "Provide rich metadata linking each dataset to its identifier, origins and processing history."
    sources:
    - ref: S9
      locator: "F2"
    - ref: S9
      locator: "F3"
    - ref: S9
      locator: "R1"
    - ref: S9
      locator: "R1.2"
  - id: data.access
    title: "Data retrieval and access controls"
    description: "Provide retrieval through a standard open protocol, including authentication and authorization when access must be restricted."
    sources:
    - ref: S9
      locator: "A1"
    - ref: S9
      locator: "A1.1"
    - ref: S9
      locator: "A1.2"
  - id: data.interoperability
    title: "Interoperable data and relationships"
    description: "Use shared representations, FAIR vocabularies and domain standards, and record meaningful links to related research objects."
    sources:
    - ref: S9
      locator: "I1"
    - ref: S9
      locator: "I2"
    - ref: S9
      locator: "I3"
    - ref: S9
      locator: "R1.3"
  - id: data.reuse-terms
    title: "Data reuse licence"
    description: "State clear and accessible terms governing reuse of the research data."
    sources:
    - ref: S9
      locator: "R1.1"
  - id: data.metadata-retention
    title: "Durable metadata records"
    description: "Keep descriptive metadata accessible after the data themselves cease to be available."
    sources:
    - ref: S9
      locator: "A2"
- id: analysis
  title: Statistical analysis and interpretation
  nodes:
  - id: analysis.methods
    title: "Statistical methods"
    description: "Describe and justify analytical methods in enough detail for a knowledgeable reader to assess and verify the results."
    sources:
    - ref: S1
      locator: "iii. Statistics"
  - id: analysis.uncertainty
    title: "Effect sizes and uncertainty"
    description: "Report quantitative estimates with appropriate uncertainty rather than treating p-values alone as evidence of importance."
    sources:
    - ref: S1
      locator: "iii. Statistics"
    - ref: S21
      locator: "5. A p-value, or statistical significance, does not measure the size of an effect or the importance of a result."
  - id: analysis.exploration
    title: "Prespecified versus exploratory analyses"
    description: "Separate prespecified analyses from exploratory and subgroup analyses in reporting."
    sources:
    - ref: S1
      locator: "iii. Statistics"
  - id: analysis.complete-outcomes
    title: "Complete outcome reporting"
    description: "Report all primary and secondary outcomes specified in the methods, including unhelpful or null findings."
    sources:
    - ref: S1
      locator: "e. Results"
  - id: analysis.denominators
    title: "Absolute numbers and denominators"
    description: "Provide underlying counts alongside percentages so readers can interpret the reported results."
    sources:
    - ref: S1
      locator: "e. Results"
  - id: analysis.interpretation
    title: "Limits of inference"
    description: "Link conclusions to the evidence, discuss limitations and distinguish statistical significance from substantive importance."
    sources:
    - ref: S1
      locator: "f. Discussion"
  - id: analysis.model-compatibility
    title: "P-values and model compatibility"
    description: "Interpret a p-value in relation to the specified statistical model rather than as a standalone verdict about the scientific claim."
    applies_when: "Studies reporting or interpreting p-values."
    sources:
    - ref: S21
      locator: "1. P-values can indicate how incompatible the data are with a specified statistical model."
  - id: analysis.hypothesis-probability
    title: "Avoid probability-of-truth claims"
    description: "Do not describe a p-value as the probability that a hypothesis is true or that chance alone produced the data."
    applies_when: "Studies reporting or interpreting p-values."
    sources:
    - ref: S21
      locator: "2. P-values do not measure the probability that the studied hypothesis is true, or the probability that the data were produced by random chance alone."
  - id: analysis.thresholds
    title: "Avoid threshold-only conclusions"
    description: "Base scientific conclusions on the study and evidence in context rather than only on crossing a p-value cutoff."
    applies_when: "Studies reporting or interpreting p-values."
    sources:
    - ref: S21
      locator: "3. Scientific conclusions and business or policy decisions should not be based only on whether a p-value passes a specific threshold."
  - id: analysis.transparency
    title: "Transparent analytical reporting"
    description: "Disclose the analytical choices and analyses needed to understand the inference rather than selectively reporting favorable results."
    applies_when: "Studies reporting or interpreting p-values."
    sources:
    - ref: S21
      locator: "4. Proper inference requires full reporting and transparency."
  - id: analysis.evidence
    title: "Evidence beyond a single p-value"
    description: "Assess evidence using the study context and appropriate supporting summaries instead of treating a p-value alone as a sufficient evidence measure."
    applies_when: "Studies reporting or interpreting p-values."
    sources:
    - ref: S21
      locator: "6. By itself, a p-value does not provide a good measure of evidence regarding a model or hypothesis."
- id: computation
  title: Reproducible analysis code
  nodes:
  - id: computation.versions
    title: "Analysis software versions"
    description: "Identify the statistical packages and exact versions used in the analysis."
    applies_when: "Analyses performed with statistical software."
    sources:
    - ref: S1
      locator: "iii. Statistics"
  - id: computation.code-access
    title: "Code availability statement"
    description: "Explain where custom code central to the conclusions can be accessed and disclose any access restrictions."
    applies_when: "Studies using custom code or algorithms central to the conclusions."
    sources:
    - ref: S10
      locator: "Availability and peer review of computer code and algorithm"
  - id: computation.review-access
    title: "Code access during review"
    description: "Provide editors and reviewers with the custom code needed to evaluate the paper's central claims."
    applies_when: "Peer review of research using central custom code or algorithms."
    sources:
    - ref: S10
      locator: "Availability and peer review of computer code and algorithm"
  - id: computation.archival-release
    title: "Archived computational release"
    description: "Deposit the custom analysis code in a persistent identifier-minting repository so readers can repeat published results."
    applies_when: "Research relying on custom computational code."
    sources:
    - ref: S10
      locator: "Availability and peer review of computer code and algorithm"
  - id: computation.software-citation
    title: "Software citation and credit"
    description: "Cite research software as a research product in the reference list rather than leaving it uncredited."
    applies_when: "Research using software."
    sources:
    - ref: S13
      locator: "1. Importance"
  - id: computation.specific-release
    title: "Specific software identification"
    description: "Make citations identify the particular software version or variant used for the reported results."
    applies_when: "Research using software."
    sources:
    - ref: S13
      locator: "6. Specificity"
  - id: computation.validation
    title: "Reproducibility validation role"
    description: "Identify the contribution responsible for checking reproducibility of the research outputs."
    applies_when: "Studies reporting reproducibility validation contributions."
    sources:
    - ref: S12
      locator: "Validation"
  - id: computation.environment
    title: "Captured analysis environment"
    description: "Record the operating system, interpreter, packages, versions and configurations needed to recreate the computational environment that produced the reported results."
    applies_when: "Computational analyses."
    sources:
    - ref: S16
      locator: "Reproducible Environments"
  - id: computation.project-layout
    title: "Research project layout"
    description: "Organize the research compendium with clearly separated raw data, analysis methods and generated results so another researcher can follow the calculation."
    applies_when: "Computational research projects."
    sources:
    - ref: S17
      locator: "Structure of a Research Compendium"
    - ref: S17
      locator: "Separating Methods, Data, Output"
  - id: computation.data-version
    title: "Analysis input versions"
    description: "Preserve and identify the precise version or subset of each dataset used to generate a reported result rather than overwriting its inputs."
    applies_when: "Research using changing or versioned datasets."
    sources:
    - ref: S18
      locator: "Importance of Version Controlling Data"
  - id: computation.executable-analysis
    title: "Executable research compendium"
    description: "Bundle data, code, manuscript components and execution instructions so the analysis and its reported figures can be regenerated as a connected workflow."
    applies_when: "Computational research projects."
    sources:
    - ref: S17
      locator: "Executable Compendium"
  - id: computation.randomness
    title: "Recorded randomness and nondeterminism"
    description: "Set and record seeds for each random generator used in the analysis and document remaining hardware or parallel-execution limits on repeatability."
    applies_when: "Stochastic analyses, simulations or models."
    sources:
    - ref: S19
      locator: "10.4. Randomness and Seeds"
  - id: computation.clean-rerun
    title: "Clean reproduction of reported results"
    description: "Rerun the analysis from the same inputs in a freshly rebuilt environment, compare its outputs with the reported results and use justified numerical tolerances."
    applies_when: "Computational analyses."
    sources:
    - ref: S19
      locator: "10.6. Testing Reproducibility"
  - id: computation.run-record
    title: "Traceable analysis runs"
    description: "Save the data version, code revision, parameters, environment and seed behind each reported figure, table or model so the run can be reconstructed."
    applies_when: "Computational experiments or analyses."
    sources:
    - ref: S19
      locator: "10.5. Documentation of Experiments"
  - id: computation.artifact-package
    title: "Complete and exercisable research artifacts"
    description: "Inventory the artifacts supporting the paper, include the components and instructions needed to run them, and document unavailable components or suitable data proxies."
    applies_when: "Research preparing an artifact package; formal ACM artifact evaluation is optional and venue-dependent."
    sources:
    - ref: S20
      locator: "Artifacts Evaluated – Functional v1.1"
- id: reporting
  title: Study-specific reporting guidelines
  nodes:
  - id: reporting.selection
    title: "Reporting guideline selection"
    description: "Select a reporting guideline appropriate to the study design and check the manuscript for required information."
    sources:
    - ref: S1
      locator: "2. Reporting Guidelines"
  - id: reporting.consort
    title: "Randomized trial reporting"
    description: "Use CONSORT to check reporting completeness for a randomized trial."
    applies_when: "Randomized trials."
    sources:
    - ref: S11
      locator: "CONSORT"
  - id: reporting.prisma
    title: "Systematic review reporting"
    description: "Use PRISMA to check reporting completeness for a systematic review or meta-analysis."
    applies_when: "Systematic reviews and meta-analyses."
    sources:
    - ref: S11
      locator: "PRISMA"
  - id: reporting.strobe
    title: "Observational study reporting"
    description: "Use STROBE to check reporting completeness for observational epidemiology."
    applies_when: "Cohort, case-control or cross-sectional observational epidemiology studies."
    sources:
    - ref: S11
      locator: "STROBE"
  - id: reporting.arrive
    title: "Animal study reporting"
    description: "Use ARRIVE to check the information reported about animal research."
    applies_when: "Animal research."
    sources:
    - ref: S11
      locator: "ARRIVE"
  - id: reporting.stard
    title: "Diagnostic accuracy reporting"
    description: "Use STARD to check reporting completeness for diagnostic accuracy research."
    applies_when: "Diagnostic test accuracy studies."
    sources:
    - ref: S11
      locator: "STARD"
  - id: reporting.qualitative
    title: "Qualitative study reporting"
    description: "Select SRQR for qualitative research reporting and check for missing study details."
    applies_when: "Qualitative research studies."
    sources:
    - ref: S11
      locator: "SRQR"
- id: manuscript
  title: Manuscript and contributions
  nodes:
  - id: manuscript.structure
    title: "Manuscript structure"
    description: "Organize the paper to reflect its research process and the article type required by the venue."
    sources:
    - ref: S1
      locator: "1. General Principles"
  - id: manuscript.title-page
    title: "Title and author metadata"
    description: "Prepare an informative title and complete author affiliations and corresponding-author details."
