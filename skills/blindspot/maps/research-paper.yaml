# skill-blindspot map: research papers and reproducible analysis (maps/research-paper.yaml)
#
# Rules for this map
#   - Every node cites a source opened on the web, with a locator that appears
#     there: a heading, principle id, skill name or task statement and Task ID.
#   - Nodes may be regrouped and reworded; unsourced concepts stay below,
#     never as nodes. Descriptions are our own words.
#   - Only titles, principle ids and short statements are cited; no source
#     body text is copied. A guideline-selection node is not its full checklist.
#
# Licence and attribution
#   O*NET: This product includes information from O*NET OnLine by the U.S.
#   Department of Labor, Employment and Training Administration (USDOL/ETA).
#   Used under CC BY 4.0. O*NET(R) is a trademark of USDOL/ETA. Task statements
#   are regrouped here; this adaptation is not endorsed by USDOL/ETA.
#   ESCO: This publication uses the ESCO classification of the European
#   Commission. The skill name is regrouped here; this is an adaptation.
#   https://esco.ec.europa.eu (licence not verified for the API record).
#   FAIR: Wilkinson et al. (2016), Scientific Data 3, 160018,
#   doi:10.1038/sdata.2016.18, CC BY 4.0; principle ids are cited and the
#   practice descriptions are adaptations in our own words.
#   The Turing Way Community: CC BY 4.0 as stated on its chapter pages;
#   only headings cited, with adapted practice descriptions.
#   ICMJE, Nature Portfolio policy pages, EQUATOR, NISO CRediT, FORCE11,
#   Harvard Kempner Institute, ACM, ASA and PLOS: licences not verified;
#   only headings, principle statements and short statements cited.
#   ASA's public release reproduces all six 2016 principles; the journal
#   article returned HTTP 403, so the release is the cited source.
#   ACM artifact evaluation is optional, not a universal publication mandate.
#
# Not yet covered (no usable source read, so no node)
#   - Detailed power/sample-size planning, missing-data methods, multiplicity
#     adjustments and causal inference diagnostics.
#   - Detailed CONSORT, PRISMA 2020, STROBE and ARRIVE checklist items;
#     only guideline selection was verified via EQUATOR and ICMJE.
#   - NIH DMS plan requirements, retention periods and jurisdiction-specific
#     consent/privacy rules; no applicable policy text was verified.
#   - Detailed post-publication corrections and retraction workflows.
#     COPE's core-practices URL returned a member Code of Conduct, not the
#     requested core practices; member/publisher obligations are not
#     generalized here into author workflow requirements.


map:
  id: research-paper
  title: Research papers and reproducible analysis
  version: 0.1.0
  updated: '2026-11-19'
  scope: "Research study planning, reproducible analysis and academic paper writing through submission and publication; this base map owns paper writing excluded by writing. Sources are strongest for biomedical and health research, with conditional nodes for specific study types, not universal mandates; analysis-code coverage is limited to research-specific environment capture, data versions, executable analysis, result reproduction, availability and citation concerns. Out of scope: grant writing, lab bench protocols, teaching, and general software-engineering practice (version control, code review, testing, CI and dependency/licence hygiene), which belongs to software."
