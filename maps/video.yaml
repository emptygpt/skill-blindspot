#   All other sources (platform pages, syllabi, textbooks): only titles and
#   section headings are cited; their licences are not verified.

map:
  id: video
  title: Video production
  version: 0.1.0
  updated: 2026-11-16
  scope: "Online video made for platforms such as YouTube, Bilibili and short-video apps: explainers, reviews and shorts, from choosing a topic to publishing and reviewing results. Out of scope: live broadcast and studio switching, feature film financing, casting, distribution deals and managing a film crew."

