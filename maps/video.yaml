groups:
  - id: topic
    title: "Topic and research"
    nodes:
      - id: topic.focus
        title: "Find your focus"
        description: "Decide what the video is about and who it is for before anything else."
        sources:
          - ref: S2a
            locator: "Find your focus"
          - ref: ONET
            locator: "27-3041.00 task: Develop story or content ideas, considering reader or audience appeal."
          - ref: ONET
            locator: "27-2012.00 task: Select plays, scripts, books, news content, or ideas to be produced."
          - ref: ESCO
            locator: "develop creative ideas"
      - id: topic.project-definition
        title: "Define the project"
        description: "State the goals and the intended audience of the project in a few clear sentences."
        sources:
          - ref: S7
            locator: "Ch13 Defining the Project"
          - ref: ESCO
            locator: "follow a brief"
      - id: topic.subject-research
        title: "Research the subject matter"
        description: "Gather factual material on the subject from the internet, archives and other sources before writing."
        sources:
          - ref: ONET
            locator: "27-2012.00 task: Research production topics using the internet, video archives, and other informational sources."
          - ref: ONET
            locator: "27-3043.05 task: Conduct research to obtain factual information and authentic detail"
          - ref: ESCO
            locator: "study topics"
          - ref: ESCO
            locator: "consult information sources"
      - id: topic.audience-research
        title: "Audience research"
        description: "Use platform data to find out what viewers search for and what else they watch."
        sources:
          - ref: S2c
            locator: "Use data to understand your audience"
          - ref: S3a
            locator: "Dive into the data"
          - ref: ESCO
            locator: "research website users"
      - id: topic.trends-evergreen
        title: "Balance trends and evergreen topics"
        description: "Mix topical subjects with subjects that stay relevant over a long time."
        sources:
          - ref: S2d
            locator: "Balance trends vs. evergreen"
          - ref: ESCO
            locator: "keep up with trends"
      - id: topic.cadence
        title: "Plan a publishing rhythm"
        description: "Set a sustainable and regular schedule for releasing videos."
        sources:
          - ref: S2d
            locator: "Create consistency, your way"
      - id: topic.new-formats
        title: "Test new formats"
        description: "Try different video formats to find out what works for the channel."
        sources:
          - ref: S2d
            locator: "Test new formats"
  - id: script
    title: "Script"
    nodes:
      - id: script.story-message
        title: "Story and core message"
        description: "Decide the story and the main message the video must deliver before writing."
        sources:
          - ref: S6
            locator: "M1 Story and message"
          - ref: ESCO
            locator: "tell a story"
          - ref: ESCO
            locator: "write storylines"
      - id: script.hook
        title: "Opening hook"
        description: "Design the first seconds so that viewers want to keep watching."
        sources:
          - ref: S6
            locator: "M1 hooks"
          - ref: S6
            locator: "M13 hooks, pacing"
      - id: script.outline
        title: "Outline the video"
        description: "List the main points and their order before shooting."
        sources:
          - ref: S2a
            locator: "Outline your video"
          - ref: ONET
            locator: "27-3043.05 task: Plan project arrangements or outlines, and organize material accordingly."
      - id: script.treatment-script
        title: "Treatment, script and screenplay"
        description: "Write the treatment and the full script in a suitable format."
        sources:
          - ref: S7
            locator: "Ch13 Preparing a Treatment / Creating a Storyboard / Writing a Script"
          - ref: S9
            locator: "Writing (Script Format)"
          - ref: ONET
            locator: "27-2012.00 task: Compose and edit scripts or provide screenwriters with story outlines from which scripts can be written."
          - ref: ESCO
            locator: "create a shooting script"
      - id: script.narration
        title: "Write narration and voice-over"
        description: "Write the spoken commentary so that it fits the pictures and the timing."
        applies_when: "the video uses narration or voice-over"
        sources:
          - ref: ESCO
            locator: "write voice-overs"
          - ref: ONET
            locator: "27-4011.00 task: Perform narration of productions or present announcements."
      - id: script.revision
        title: "Revise the script"
        description: "Rework the script after feedback until it is ready to shoot."
        sources:
          - ref: ESCO
            locator: "edit scripts"
          - ref: ESCO
            locator: "adapt a script"
          - ref: ONET
            locator: "27-2012.00 task: Consult with writers, producers, or actors about script changes"
      - id: script.shot-list-storyboard
        title: "Shot list and storyboard"
        description: "Plan each shot and sketch the key frames before filming."
        sources:
          - ref: S6
            locator: "M1 Shot lists and storyboards"
          - ref: ESCO
            locator: "create storyboards"
          - ref: ONET
            locator: "27-2012.00 task: Plan details such as framing, composition, camera movement, sound, and actor movement for each shot or scene."
      - id: script.ai-assisted
        title: "AI-assisted scripting and shot planning"
        description: "Use AI tools to draft scripts and shot plans, and check what they produce."
        applies_when: "AI tools are used in planning"
        sources:
          - ref: S6
            locator: "M14 Plan and produce with AI"
  - id: preproduction
    title: "Pre-production"
    nodes:
      - id: pre.breakdown
        title: "Script reading and breakdown"
        description: "Read the script closely and list the scenes, locations, people and equipment each needs."
        sources:
          - ref: S6
            locator: "M1 Breakdown"
          - ref: ONET
            locator: "27-2012.00 task: Study and research scripts to determine how they should be directed."
          - ref: ONET
            locator: "27-4032.00 task: Study scripts to become familiar with production concepts and requirements."
          - ref: ESCO
            locator: "analyse a script"
          - ref: ESCO
            locator: "read scripts"
      - id: pre.production-plan
        title: "Production plan"
        description: "Plan people, places, equipment, schedule and workflow for the shoot."
        sources:
          - ref: S7
            locator: "Ch15 People / Places / Things / Plans"
          - ref: S9
            locator: "Pre-Production Planning"
          - ref: ESCO
            locator: "create production schedules"
          - ref: ESCO
            locator: "make film shooting schedule"
          - ref: ONET
            locator: "27-2012.00 task: Identify and approve equipment and elements required for productions"
      - id: pre.budget
        title: "Budget"
        description: "Estimate and keep track of what the production will cost."
        sources:
          - ref: S6
            locator: "M4 Budgeting"
          - ref: S7
            locator: "Ch15 Budgets"
          - ref: ESCO
            locator: "calculate production costs"
          - ref: ESCO
            locator: "monitor production costs"
      - id: pre.location
        title: "Location scouting and sound assessment"
        description: "Check locations for light, power, space and noise before shooting."
        applies_when: "filming outside a controlled space"
        sources:
          - ref: S6
            locator: "M3 Sound assessment"
          - ref: S6
            locator: "M3 Light, power, space"
          - ref: ONET
            locator: "27-4031.00 task: Observe sets or locations for potential problems and to determine filming and lighting requirements."
          - ref: ESCO
            locator: "search for a suitable location"
      - id: pre.releases
        title: "Releases and permissions"
        description: "Get written permission for likenesses and locations that appear in the video."
        applies_when: "filming identifiable people or private places"
        sources:
          - ref: S6
            locator: "M1 Releases"
          - ref: S7
            locator: "Ch3 Releases"
          - ref: S9
            locator: "Copyright & Talent Releases"
          - ref: S9
            locator: "Talent Release"
      - id: pre.aspect-ratio
        title: "Choose format for the target platform"
        description: "Pick the aspect ratio and format that suit the platform the video is for."
        applies_when: "publishing to a platform"
        sources:
          - ref: S6
            locator: "M13 Format and aspect ratio"
      - id: pre.thumbnail-stills
        title: "Capture thumbnail material while shooting"
        description: "Take extra photos during the shoot to use for the thumbnail."
        applies_when: "publishing to a platform"
        sources:
          - ref: S3a
            locator: "We recommend"
  - id: shooting
    title: "Shooting and capture"
    nodes:
      - id: shoot.equipment-test
        title: "Test equipment before shooting"
        description: "Check that cameras, microphones and other gear work properly before the shoot."
        sources:
          - ref: ONET
            locator: "27-4031.00 task: Test, clean, maintain, and repair broadcast equipment, including testing microphones, to ensure proper working condition."
          - ref: ONET
            locator: "27-2012.05 task: Test equipment to ensure proper operation."
          - ref: ESCO
            locator: "set up cameras"
          - ref: ESCO
            locator: "maintain audiovisual equipment"
      - id: shoot.camera-controls
        title: "Camera and phone manual controls"
        description: "Operate the camera or phone with manual control of focus, exposure and settings."
        sources:
          - ref: S6
            locator: "M5 The Phone as a Pro Camera"
          - ref: S7
            locator: "Ch9 Camera Operation"
          - ref: ESCO
            locator: "operate a camera"
          - ref: ESCO
            locator: "select camera apertures"
      - id: shoot.composition-coverage
        title: "Composition and coverage"
        description: "Frame shots well and cover the scene with enough shots, including B-roll, to edit later."
        sources:
          - ref: S6
            locator: "M6 Composition & Coverage"
          - ref: S7
            locator: "Ch8 Video Composition"
          - ref: ONET
            locator: "27-4031.00 task: Compose and frame each shot, applying the technical aspects of light, lenses, film, filters, and camera settings"
          - ref: ESCO
            locator: "plan shots"
      - id: shoot.lighting
        title: "Lighting"
        description: "Light the subject so the picture is clear and looks as intended."
        sources:
          - ref: S6
            locator: "M7 Lighting Fundamentals"
          - ref: S7
            locator: "Lighting a Production (Ch16-18)"
          - ref: ESCO
            locator: "lighting techniques"
      - id: shoot.on-camera
        title: "On-camera presenting and interviews"
        description: "Set up and direct presenters and interviewees in front of the camera."
        applies_when: "people appear on camera"
        sources:
          - ref: S6
            locator: "M9 On-camera presenting / Interview setup"
          - ref: ESCO
            locator: "interview techniques"
      - id: shoot.pickups
        title: "Continuity and pickups"
        description: "Check continuity and re-shoot missing or poor shots."
        sources:
          - ref: S6
            locator: "M9 Continuity and pickups"
      - id: shoot.shorts-capture
        title: "Record or upload a Short"
        description: "Record the vertical short-form video or bring in existing footage."
        applies_when: "making short-form vertical video"
        sources:
          - ref: S2b
            locator: "3 Upload or record your video"
      - id: shoot.review-footage-daily
        title: "Review footage during production"
        description: "Look at what has been shot while production is still running, to catch problems and plan what to shoot next."
        sources:
          - ref: ONET
            locator: "27-2012.00 task: Review film daily to check on work in progress and to plan for future filming."
          - ref: ONET
            locator: "27-4031.00 task: View films to resolve problems of exposure control"
          - ref: S8
            locator: "Acquisition Lab / Log Acquisition shots"
  - id: assets
    title: "Assets and rights"
    nodes:
      - id: assets.file-management
        title: "File management"
        description: "Import, name, organise and back up all media files."
        sources:
          - ref: S6
            locator: "M10 File management"
          - ref: ESCO
            locator: "file-based workflow"
          - ref: ESCO
            locator: "convert different audiovisual formats"
      - id: assets.ingest-logging
        title: "Ingest and log footage"
        description: "Transfer raw recordings to the computer and log what each clip contains."
        sources:
          - ref: S8
            locator: "Acquisition Lab / Log Acquisition shots"
          - ref: ONET
            locator: "27-4011.00 task: Compress, digitize, duplicate, and store audio and video data."
          - ref: ESCO
            locator: "transfer uncut audiovisual material to computer"
          - ref: ESCO
            locator: "put uncut recordings into computer"
      - id: assets.music-licensing
        title: "Music licensing and copyright basics"
        description: "Check that the music used is licensed for the platform and purpose."
        sources:
          - ref: S6
            locator: "M1 music-licensing and copyright basics"
          - ref: S2b
            locator: "Choose your music"
          - ref: ESCO
            locator: "purchase music"
      - id: assets.rights-acquisition
        title: "Obtain rights to third-party material"
        description: "Get permission or a licence to use other people's footage, images, music or scripts."
        applies_when: "using material made by others"
        sources:
          - ref: ONET
            locator: "27-2012.00 task: Obtain rights to scripts or to such items as existing video footage."
          - ref: ONET
            locator: "27-3041.00 task: Arrange for copyright permissions."
          - ref: ESCO
            locator: "negotiate exploitation rights"
      - id: assets.copyright-fair-use
        title: "Copyright and fair use rules"
        description: "Understand copyright, fair use and what a copyright strike means."
        sources:
          - ref: S2e
            locator: "Copyright"
          - ref: S2e
            locator: "Fair use"
          - ref: S2e
            locator: "What is a copyright strike?"
          - ref: ESCO
            locator: "copyright legislation"
      - id: assets.font-licensing
        title: "Font licensing for covers"
        description: "Make sure fonts used in covers and graphics may be used."
        applies_when: "using fonts in covers or on-screen text"
        sources:
          - ref: S4
            locator: "注意字体版权问题"
      - id: assets.generative-material
        title: "Boundaries for generated footage"
        description: "Decide what AI-generated B-roll and other generated material may be used for."
        applies_when: "AI-generated material is used"
        sources:
          - ref: S6
            locator: "M14 generative b-roll"
  - id: editing
    title: "Editing"
    nodes:
      - id: edit.review-footage
        title: "Review footage before cutting"
        description: "Watch all the material through once, scene by scene, before assembling."
        sources:
          - ref: ONET
            locator: "27-4032.00 task: Review footage sequence by sequence to become familiar with it before assembling it into a final product."
          - ref: ESCO
            locator: "watch scenes"
      - id: edit.rough-cut
        title: "Rough cut and assembly test"
        description: "Assemble a rough cut to find gaps in coverage."
        sources:
          - ref: S6
            locator: "M10 Assemble one scene"
          - ref: ONET
            locator: "27-4032.00 task: Organize and string together raw footage into a continuous whole according to scripts or the instructions of directors and producers."
      - id: edit.principles
        title: "Editing principles"
        description: "Apply continuity, emphasis and pace when cutting."
        sources:
          - ref: S7
            locator: "Ch22 Continuity / Emphasis / Pace"
          - ref: S9
            locator: "Editing (Principles)"
          - ref: ONET
            locator: "27-4032.00 task: Select and combine the most effective shots of each scene to form a logical and smoothly running story."
          - ref: ONET
            locator: "27-2012.00 task: Establish pace of programs and sequences of scenes"
      - id: edit.workflow
        title: "Editing workflow"
        description: "Cut the video in an editing program from raw clips to a finished edit."
        sources:
          - ref: S2a
            locator: "Edit your video"
          - ref: S2b
            locator: "Edit your Short"
          - ref: ONET
            locator: "27-4032.00 task: Edit films and videotapes to insert music, dialogue, and sound effects, to arrange films into sequences, and to correct errors"
          - ref: ESCO
            locator: "perform video editing"
          - ref: ESCO
            locator: "cut raw footage digitally"
      - id: edit.colour
        title: "Colour correction and grading"
        description: "Correct and match colour and brightness between shots."
        sources:
          - ref: S6
            locator: "M10 basic color correction"
          - ref: ESCO
            locator: "apply colour grading"
          - ref: ESCO
            locator: "colour grading"
      - id: edit.titles-transitions
        title: "On-screen titles, graphics and transitions"
        description: "Add title cards, lower thirds, transitions and effects."
        sources:
          - ref: S6
            locator: "M10 titles and lower thirds"
          - ref: S7
            locator: "Ch23 Adding Transitions and Other Effects"
          - ref: ONET
            locator: "27-4032.00 task: Program computerized graphic effects."
          - ref: ESCO
            locator: "motion graphics"
          - ref: ESCO
            locator: "create special effects"
  - id: sound
    title: "Sound"
    nodes:
      - id: sound.recording-monitoring
        title: "Recording and monitoring audio"
        description: "Place microphones, set levels and monitor sound while recording."
        sources:
          - ref: S6
            locator: "M8 Placement and levels / Monitoring and room"
          - ref: S7
            locator: "Ch12 Recording Audio"
          - ref: ESCO
            locator: "set up basic recording"
          - ref: ESCO
            locator: "plan audiovisual recording"
      - id: sound.narration-recording
        title: "Record narration"
        description: "Record the voice-over in a quiet place with good levels."
        applies_when: "the video uses narration or voice-over"
        sources:
          - ref: ONET
            locator: "27-4011.00 task: Perform narration of productions or present announcements."
      - id: sound.audio-editing
        title: "Edit recorded sound"
        description: "Clean up, trim and arrange recorded dialogue and other audio."
        sources:
          - ref: ONET
            locator: "27-4011.00 task: Record and edit audio material, such as movie soundtracks, using audio recording and editing equipment."
          - ref: ESCO
            locator: "edit recorded sound"
          - ref: ESCO
            locator: "audio editing software"
      - id: sound.ai-cleanup
        title: "AI noise reduction and repair"
        description: "Use AI tools to reduce noise and repair poor audio."
        applies_when: "AI tools are used for audio"
        sources:
          - ref: S6
            locator: "M8 AI audio cleanup"
      - id: sound.music-selection
        title: "Choose music"
        description: "Pick the music that fits the video and the platform."
        sources:
          - ref: S2b
            locator: "Choose your music"
          - ref: ONET
            locator: "27-4032.00 task: Determine the specific audio and visual effects and music necessary to complete films."
          - ref: ONET
            locator: "27-4032.00 task: Collaborate with music editors to select appropriate passages of music"
      - id: sound.effects
        title: "Sound effects: record or select"
        description: "Record needed sounds or pick them from a sound effects library."
        sources:
          - ref: ONET
            locator: "27-4032.00 task: Record needed sounds or obtain them from sound effects libraries."
          - ref: ONET
            locator: "27-4032.00 task: Discuss the sound requirements of pictures with sound effects editors."
      - id: sound.mix
        title: "Audio mix and sound design"
        description: "Balance dialogue, music and effects into the final soundtrack."
        sources:
          - ref: S6
            locator: "M10 an audio mix"
          - ref: S7
