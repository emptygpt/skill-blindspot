# skill-blindspot map: video production (maps/video.yaml)
#
# Rules for this map
#   - Every node must cite at least one source that really exists in the
#     "sources" list, with a locator copied from that source: a section or
#     chapter title, an O*NET task sentence (may be shortened), or an ESCO
#     skill name.
#   - Nodes may be merged and reworded, but a node with no source must never
#     be added. Gaps that no source covers are recorded elsewhere, not as nodes.
#   - Sources are only cited for titles and short task statements; no body
