name: check-maps

on:
  push:
    paths: ["skills/blindspot/maps/**", "scripts/check_maps.py", ".github/workflows/check-maps.yml"]
  pull_request:
    paths: ["skills/blindspot/maps/**", "scripts/check_maps.py", ".github/workflows/check-maps.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check_maps.py
